        <style>
        .unified-search {
            position: relative !important;
            float: left !important;
            top: unset; left: unset;
            margin-top: 8px; margin-left: 8px;
            clear: both;
            display: flex;
            align-items: flex-start;
        }
        .unified-search-panel { margin-left: 4px; }
        .unified-search-input {
            width: 360px; max-width: 70vw;
            height: 1.6em; padding: 0 8px;
            border: 1px solid #ccc; border-radius: 10px;
            font-size: 14px;
        }
        .unified-search-results {
            list-style: none; margin: 4px 0 0; padding: 0;
            max-width: 380px; max-height: 260px; overflow-y: auto;
            background: #fff; font-family: Arial, sans-serif;
            box-shadow: 0 4px 9px #999;
        }
        .unified-search-results:empty { display: none; }
        .unified-search-results li { padding: 5px 10px; cursor: pointer; font-size: 13px; }
        .unified-search-results li:hover { background: #ff8c9d; }
        .unified-search-results li strong, .unified-search-results li small { display: block; }
        .unified-search-results li.unified-search-msg { cursor: default; color: #666; }
        .unified-search-results li.unified-search-msg:hover { background: none; }
        .unified-search-results li.unified-search-header {
            cursor: default; background: #eee; font-weight: bold;
            font-size: 11px; text-transform: uppercase; color: #555;
        }
        .unified-search-results li.unified-search-header:hover { background: #eee; }
        .parcel-info { font-family: Arial, sans-serif; font-size: 13px; min-width: 240px; }
        .parcel-info > b { display: block; font-size: 15px; margin-bottom: 4px; }
        .parcel-info table { border-collapse: collapse; width: 100%; }
        .parcel-info th { text-align: left; font-weight: normal; color: #666; padding: 2px 8px 2px 0; white-space: nowrap; vertical-align: top; }
        .parcel-info td { padding: 2px 0; }
        .parcel-info small { display: block; color: #888; font-size: 11px; margin-top: 4px; }
        .parcel-info a { display: inline-block; margin-top: 6px; }
        </style>
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <style>
        /* Panel "Warstwy" (resources/panel-warstw.js) - wyglad jak panel "Szczegolowe dane" */
        .panele-lewy-dol { position: absolute; left: 8px; bottom: 34px; z-index: 5; display: flex; flex-direction: column;
          align-items: flex-start; gap: 8px; pointer-events: none;
          /* panele kończą się pod przyciskami w lewym górnym rogu (zoom, lokalizacja, pomiar, szukaj – do ok. 160 px) */
          max-height: calc(100% - 210px); }
        .panele-lewy-dol > * { pointer-events: auto; }
        .panele-lewy-dol .rolnik-panel.rolnik-panel { position: static; display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; }
        .panele-lewy-dol .rolnik-panel .rolnik-naglowek { flex: none; }
        .panele-lewy-dol .rolnik-panel .rolnik-tresc { max-height: none; min-height: 0; overflow-y: auto; }
        .panele-lewy-dol .rolnik-panel.zwiniety .rolnik-tresc { display: none; }
        .panel-warstw { background: #fff; width: 270px; font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
          color: #222; box-shadow: 0 1px 6px rgba(0,0,0,.3); border-radius: 6px; overflow: hidden; text-align: left; }
        .panel-warstw .rolnik-naglowek { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px;
          background: #2e5e2a; color: #fff; font-weight: 600; }
        .panel-warstw .rolnik-zwin { background: none; border: 0; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; margin: 0; }
        .panel-warstw .rolnik-tresc { padding: 6px 10px 8px; }
        .panel-warstw-lista ul { list-style: none; margin: 0; padding: 0; }
        .panel-warstw-lista ul ul { padding-left: 14px; }
        .panel-warstw-lista li { margin: 2px 0; }
        .panel-warstw-lista li.group > label { font-weight: 600; color: #2e5e2a; }
        .panel-warstw-lista li.group { margin-top: 6px; }
        .panel-warstw-lista label { cursor: pointer; }
        .panel-warstw-lista input { margin: 0 5px 0 0; vertical-align: middle; }
        .panel-warstw-lista img { max-width: 22px; max-height: 22px; vertical-align: middle; }
        .panel-warstw-lista .layer-switcher-fold > button, .panel-warstw-lista .group > button { display: none; }
        @media (max-width: 600px) { .panele-lewy-dol .rolnik-panel { width: min(270px, calc(100vw - 70px)); } }
        /* logo w prawym dolnym rogu (resources/panel-warstw.js) */
        .logo-mapy { position: absolute; right: 10px; bottom: 26px; z-index: 4; width: 180px; pointer-events: none; }
        .logo-mapy img { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
        @media (max-width: 600px) { .logo-mapy { width: 110px; } }
        .panel-pusty { color: #666; font-size: 12px; padding: 2px 0; }
        /* panel warstw z rolnik.js osadzony w zakładce Layers */
        .panele-lewy-dol .rolnik-osadzony { box-shadow: none; width: auto; border-radius: 0; overflow: visible; }
        .panele-lewy-dol .rolnik-osadzony .rolnik-naglowek { display: none; }
        .panele-lewy-dol .rolnik-panel .rolnik-osadzony .rolnik-tresc, .panele-lewy-dol .rolnik-osadzony .rolnik-tresc { padding: 0; max-height: none; overflow: visible; }
        .panel-warstwy-analityczne, .panel-mapy-zagrozenia { margin-top: 8px; }
        /* zwinięte panele nie mogą się ściskać – zawsze widać ich nagłówek */
        .panele-lewy-dol .rolnik-panel.rolnik-panel.zwiniety { flex-shrink: 0; }
        .panele-lewy-dol > .rolnik-panel { min-height: 32px; }
        </style>
