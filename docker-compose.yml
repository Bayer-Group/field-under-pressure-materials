services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      EARTHENGINE_PROJECT: ${EARTHENGINE_PROJECT:-}
      EARTHENGINE_MODEL_ASSET: ${EARTHENGINE_MODEL_ASSET:-}
      MONGO_URI: ${BACKEND_MONGO_URI:-}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-field_under_pressure}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_ORCHARD_ID: ${MONGO_ORCHARD_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: ./ui
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  mongodb:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: field-under-pressure-mongodb:latest
    container_name: fup-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-field_under_pressure}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seed:
    image: mongo:8.0
    profiles: [seed]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_DB: ${MONGO_DB:-field_under_pressure}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - type: bind
        source: ./db/scripts/seed.js
        target: /seed.js
        read_only: true
        bind:
          create_host_path: false
    entrypoint:
      - /bin/bash
      - -ec
      - >
        exec mongosh --quiet --host mongodb --port 27017
        --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD"
        --authenticationDatabase admin "$$MONGO_DB" --file /seed.js

volumes:
  mongodb_data:
