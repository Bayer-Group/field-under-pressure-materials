<!doctype html>
<!--
  Terranos: 30-second showcase video, written as code.
  Every frame is a pure function of time: seek(t) lays out the whole stage for second t.
  - Open this file in a browser to watch it play (Space pauses, arrow keys step, click the bar to scrub).
  - showcase/render.mjs calls seek() frame by frame and pipes screenshots into ffmpeg.
  The screens are real captures of the GUI (showcase/capture.mjs), with element positions in shots/rects.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terranos showcase</title>
<style>
  :root {
    --ink: #0b1a12; --deep: #0f2a1c; --green: #1f6f43; --leaf: #34a865; --lime: #b5f26b;
    --amber: #f59e0b; --visit: #ea580c; --sky: #60a5fa; --cream: #f3f7f1; --soft: #b9d3c3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  body { font-family: 'Roboto', system-ui, sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased; }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); transform-origin: 50% 50%; }
  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; inset: 0; display: none; }

  /* background */
  #bg { position: absolute; inset: 0;
    background: radial-gradient(1200px 800px at 20% 10%, #16402a 0%, transparent 60%),
                radial-gradient(1000px 700px at 90% 100%, #123524 0%, transparent 60%), var(--ink); }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: .45; }
  #dots { position: absolute; inset: -60px;
    background-image: radial-gradient(rgba(181,242,107,.16) 1.4px, transparent 1.6px); background-size: 44px 44px; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }

  /* text */
  .kicker { font-size: 22px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--lime); }
  .kicker b { color: var(--cream); opacity: .55; font-weight: 700; margin-right: 14px; }
  .heading { font-size: 76px; font-weight: 900; letter-spacing: -0.025em; line-height: 1.02; white-space: nowrap; }
  .sub { font-size: 28px; font-weight: 300; color: var(--soft); white-space: nowrap; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
  .mask > span { display: inline-block; will-change: transform; }
  .hl { color: var(--lime); }

  /* browser window around a screenshot */
  .win { position: absolute; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); transform-origin: 50% 0%; }
  .win .bar { height: 44px; background: #eef1ec; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid #dde2db; }
  .win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #d7dbd5; }
  .win .bar i:nth-child(1) { background: #f87171; } .win .bar i:nth-child(2) { background: #fbbf24; } .win .bar i:nth-child(3) { background: #4ade80; }
  .win .url { margin-left: 18px; flex: 1; max-width: 520px; height: 26px; border-radius: 13px; background: #fff; color: #5b665f;
    font-size: 14px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
  .vp { position: relative; overflow: hidden; background: #f3f4f1; }
  .vp img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* crop of a screenshot shown as a floating tile */
  .tile { position: absolute; background-repeat: no-repeat; border-radius: 12px; background-color: #fff;
    box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.05); }

  /* annotations */
  .ring { position: absolute; border-radius: 50%; border: 4px solid var(--lime); }
  .glow { position: absolute; border-radius: 12px; border: 4px solid var(--lime);
    box-shadow: 0 0 0 6px rgba(181,242,107,.25), 0 0 40px rgba(181,242,107,.55); }
  .pill { position: absolute; white-space: nowrap; padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 700;
    background: var(--cream); color: var(--ink); box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .pill small { font-weight: 400; color: #4b5a51; margin-left: 8px; font-size: 20px; }
  .chip { position: absolute; display: flex; align-items: center; gap: 16px; padding: 18px 26px; border-radius: 18px; white-space: nowrap;
    background: rgba(12,32,22,.88); border: 1px solid rgba(181,242,107,.25); box-shadow: 0 20px 60px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  .chip .n { font-size: 44px; font-weight: 900; letter-spacing: -0.02em; }
  .chip .l { font-size: 22px; color: var(--soft); line-height: 1.15; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .scrub { position: absolute; width: 4px; background: var(--lime); box-shadow: 0 0 18px var(--lime); border-radius: 2px; }
  .scrub-tag { position: absolute; padding: 6px 14px; border-radius: 10px; background: var(--lime); color: var(--ink); font-weight: 900; font-size: 26px; transform: translateX(-50%); }
  #cursor { position: absolute; width: 44px; height: 44px; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  #ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 4px solid #fff; z-index: 49; }

  /* intro word flashes */
  .flash-word { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-size: 170px; font-weight: 900; letter-spacing: -0.04em;
    transform-origin: 50% 50%; text-shadow: 0 10px 60px rgba(0,0,0,.6); white-space: nowrap; }
  .flash-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .flash-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,26,18,.55), rgba(11,26,18,.85)); }

  #wipe { position: absolute; top: -200px; height: 1480px; width: 2700px; z-index: 80; transform-origin: 0 0; }
  #wipe .edge { position: absolute; right: 0; top: 0; bottom: 0; width: 26px; background: var(--lime); }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--leaf), var(--lime)); z-index: 90; }
  .tag { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; font-size: 28px; font-weight: 700;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); white-space: nowrap; position: absolute; }

  /* preview controls (hidden while rendering) */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; background: rgba(0,0,0,.6); display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #ddd; font: 13px system-ui; z-index: 100; }
  #ui .track { flex: 1; height: 6px; background: #333; border-radius: 3px; position: relative; cursor: pointer; }
  #ui .track b { position: absolute; left: 0; top: 0; bottom: 0; background: #b5f26b; border-radius: 3px; }
  body.render #ui { display: none; }
</style>
<script src="shots/rects.js"></script>
<script src="brand/logo.js"></script>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<div id="ui"><span id="time">0.00 s</span><div class="track" id="track"><b id="bar"></b></div><span>Space: play/pause · ←/→: step</span></div>
<script>
'use strict'
const DURATION = 30, FPS = 30, SW = 2400, SH = 1350  // screenshot size in px
const R = window.RECTS
const stage = document.getElementById('stage')

// ---------- time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, p) => a + (b - a) * p
const E = {
  lin: (x) => x,
  out3: (x) => 1 - (1 - x) ** 3,
  in3: (x) => x * x * x,
  inout3: (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  outExpo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  outBack: (x) => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2 },
  outElastic: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
}
/** Keyframes [[t, value], ...]; values are numbers or arrays of numbers. */
function kf(t, frames, ease = E.inout3) {
  if (t <= frames[0][0]) return frames[0][1]
  for (let i = 0; i < frames.length - 1; i++) {
    const [t0, v0] = frames[i], [t1, v1] = frames[i + 1]
    if (t <= t1) {
      const p = ease(prog(t, t0, t1))
      return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], p)) : lerp(v0, v1, p)
    }
  }
  return frames.at(-1)[1]
}
/** 0 -> 1 on the way in, 1 -> 0 on the way out: for things that appear at `a` and leave at `b`. */
const life = (t, a, b, inDur = 0.4, outDur = 0.3, ease = E.out3) =>
  Math.min(ease(prog(t, a, a + inDur)), 1 - E.in3(prog(t, b - outDur, b)))

// ---------- DOM helpers ----------
function el(tag, cls, parent, html) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (html != null) e.innerHTML = html
  ;(parent ?? stage).appendChild(e)
  return e
}
const css = (e, s) => { for (const k in s) e.style[k] = s[k]; return e }
const place = (e, x, y, extra = '') => { e.style.transform = `translate(${x}px, ${y}px) ${extra}` }

/** Words that rise out of a mask one by one. */
function words(parent, html, cls, x, y) {
  const box = el('div', cls + ' abs', parent)
  place(box, x, y)
  const parts = html.split(/\s+(?![^<]*>)/)
  box.innerHTML = parts.map((w) => `<span class="mask"><span>${w}</span></span>`).join(' ')
  const inner = [...box.querySelectorAll('.mask > span')]
  return {
    box,
    update(t, start, end, stagger = 0.06, dur = 0.5) {
      inner.forEach((s, i) => {
        const pin = E.outExpo(prog(t, start + i * stagger, start + i * stagger + dur))
        const pout = E.in3(prog(t, end - 0.3, end))
        s.style.transform = `translateY(${(1 - pin) * 110 + pout * -110}%)`
      })
    },
  }
}

/** A crop of a screenshot as a floating card. rect is [x, y, w, h] in screenshot pixels. */
function tile(parent, shot, rect, scale) {
  const [x, y, w, h] = rect
  const e = el('div', 'tile', parent)
  css(e, { width: w * scale + 'px', height: h * scale + 'px', backgroundImage: `url(shots/${shot}.png)`,
    backgroundSize: `${SW * scale}px ${SH * scale}px`, backgroundPosition: `${-x * scale}px ${-y * scale}px` })
  e.w = w * scale; e.h = h * scale
  return e
}

/** A browser window showing one screenshot through a movable camera. */
function browserWindow(parent, shots, x, y, vw, vh) {
  const win = el('div', 'win', parent)
  css(win, { width: vw + 'px', height: vh + 44 + 'px', left: x + 'px', top: y + 'px' })
  el('div', 'bar', win, '<i></i><i></i><i></i><div class="url">🔒 localhost · Terranos</div>')
  const vp = el('div', 'vp', win)
  css(vp, { width: vw + 'px', height: vh + 'px' })
  const imgs = Object.fromEntries(shots.map((s) => {
    const i = el('img', '', vp); i.src = `shots/${s}.png`; i.width = SW; i.height = SH; return [s, i]
  }))
  const cam = { s: 1, tx: 0, ty: 0 }
  return {
    win, vp, imgs,
    /** Fit rect [x, y, w, h] (screenshot px) into the viewport. */
    camera(rect) {
      const [rx, ry, rw, rh] = rect
      cam.s = Math.min(vw / rw, vh / rh)
      cam.tx = vw / 2 - (rx + rw / 2) * cam.s
      cam.ty = vh / 2 - (ry + rh / 2) * cam.s
      for (const i of Object.values(imgs)) i.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.s})`
    },
    /** Screenshot point -> stage point (ignores the window's own 3D tilt, which is 0 while annotating). */
    toStage(px, py) { return [x + cam.tx + px * cam.s, y + 44 + cam.ty + py * cam.s] },
    scale: () => cam.s,
  }
}

const center = (r) => [r[0] + r[2] / 2, r[1] + r[3] / 2]

// ---------- persistent layers ----------
const bg = el('div', '', stage); bg.id = 'bg'
const blobA = el('div', 'blob', bg); blobA.style.background = '#2f9e5a'
const blobB = el('div', 'blob', bg); blobB.style.background = '#c9a227'
const dots = el('div', '', bg); dots.id = 'dots'
el('div', '', stage).id = 'vignette'

const scenes = []
function scene(start, end, build) {
  const root = el('div', 'scene', stage)
  const update = build(root)
  scenes.push({ start, end, root, update })
}

// Brand mark: the Terranos wordmark as two images (letters, globe) so the globe can roll into the "o".
// Globe position comes from brand/logo.js (scripts/make_brand_assets.py).
function lockup(parent, width) {
  const L = window.LOGO
  const box = el('div', 'abs', parent); css(box, { width: width + 'px', height: width * L.aspect + 'px' })
  const letters = el('img', 'abs', box); letters.src = 'brand/terranos-dark-letters.png'; css(letters, { width: '100%', height: '100%' })
  const globe = el('img', 'abs', box); globe.src = 'brand/terranos-globe.png'
  const d = L.d * width
  css(globe, { width: d + 'px', height: d + 'px', left: L.x * width - d / 2 + 'px', top: L.y * width * L.aspect - d / 2 + 'px' })
  const ROLL = 640, TURNS = ROLL / (Math.PI * d)
  /** p: 0..1 letters wipe; g: 0..1 globe roll (may overshoot with outBack). */
  const set = (p, g) => {
    letters.style.clipPath = `inset(0 ${(1 - clamp(p)) * 100}% 0 0)`
    globe.style.opacity = clamp(g * 4)
    globe.style.transform = `translateX(${(1 - g) * ROLL}px) rotate(${(1 - g) * TURNS * 360}deg)`
  }
  return { box, set, width, height: width * L.aspect }
}

// =====================================================================================
// 0-4 s  Intro: logo builds, then four beat-synced word flashes
// =====================================================================================
scene(0, 4, (root) => {
  const logo = lockup(root, 1100)
  const sub = el('div', 'sub abs', root, 'Your fields, <b style="color:#b5f26b;font-weight:700">from orbit to the microbe</b>')
  css(sub, { fontSize: '36px' })

  const flashes = [
    { word: 'Satellites.', color: '#b5f26b', shot: 'greenness', rect: R.greenness.chart[0] },
    { word: 'Aerial photos.', color: '#7cc4ff', shot: 'greenness', rect: R.greenness.map[0] },
    { word: 'Soil microbes.', color: '#fbbf24', shot: 'microbes-fungi', rect: [33, 640, 1325, 700] },
    { word: 'One map.', color: '#ffffff', shot: 'greenness-map', rect: R['greenness-map'].map[0] },
  ].map((f) => {
    const wrap = el('div', 'scene', root); wrap.style.display = 'block'
    const bgTile = tile(wrap, f.shot, f.rect, 1920 / f.rect[2] * 1.15)
    css(bgTile, { borderRadius: 0, left: '50%', top: '50%' })
    el('div', 'flash-shade', wrap)
    const w = el('div', 'flash-word', wrap, f.word); w.style.color = f.color
    return { ...f, wrap, bgTile, w }
  })

  return (t) => {
    // logo + title (0-2 s)
    const out = E.in3(prog(t, 1.75, 2.0))
    logo.set(E.inout3(prog(t, 0.05, 0.85)), E.outBack(prog(t, 0.2, 1.15)))
    place(logo.box, 960 - logo.width / 2, 520 - logo.height - out * 40)
    logo.box.style.opacity = 1 - out
    css(sub, { left: '0', width: '1920px', textAlign: 'center' })
    place(sub, 0, 640 + (1 - E.out3(prog(t, 0.9, 1.4))) * 30 - out * 40)
    sub.style.opacity = E.out3(prog(t, 0.9, 1.4)) * (1 - out)

    // word flashes on the beat (2.0, 2.5, 3.0, 3.5)
    flashes.forEach((f, i) => {
      const a = 2 + i * 0.5, on = t >= a && t < a + 0.5
      f.wrap.style.display = on ? 'block' : 'none'
      if (!on) return
      const lt = t - a
      const punch = 1 + 0.18 * (1 - E.out3(clamp(lt / 0.18)))
      f.w.style.transform = `translateY(-50%) scale(${punch})`
      const zoom = 1 + lt * 0.25
      f.bgTile.style.transform = `translate(-50%, -50%) scale(${zoom}) rotate(${(i % 2 ? 1 : -1) * 1.5}deg)`
    })
  }
})

// =====================================================================================
// 4-8 s  Overview map: 29 plots, 2 sites
// =====================================================================================
const WX = 266, WY = 218, VW = 1387, VH = 780
scene(4, 8, (root) => {
  const kick = words(root, '<b>01</b>Explore', 'kicker', WX, 70)
  const head = words(root, '<span class="hl" id="cnt">29</span> plots. 2 sites. One map.', 'heading', WX, 104)
  const cnt = head.box.querySelector('#cnt')
  const w = browserWindow(root, ['overview'], WX, WY, VW, VH)
  const ster = center(R.overview.marker.find((m) => m[0] < 1500))
  const kona = center(R.overview.marker.find((m) => m[0] > 2000))
  const pins = [
    { at: ster, label: 'North Sterling, CO', small: '19 plots · dryland', t0: 5.55 },
    { at: kona, label: 'Konza Prairie, KS', small: '10 plots', t0: 5.85 },
  ].map((p) => ({ ...p, rings: [0, 1, 2].map(() => el('div', 'ring', root)), pill: el('div', 'pill', root, `${p.label}<small>${p.small}</small>`) }))
  return (t) => {
    kick.update(t, 4.05, 8.2); head.update(t, 4.1, 8.2, 0.07)
    cnt.textContent = Math.round(29 * E.out3(prog(t, 4.2, 5.2)))
    const ent = E.outExpo(prog(t, 4.0, 4.8))
    w.win.style.transform = `perspective(2000px) translateY(${(1 - ent) * 380}px) rotateX(${(1 - ent) * 22}deg) scale(${0.86 + 0.14 * ent})`
    w.camera(kf(t, [[4.0, [0, 0, SW, SH]], [4.9, [0, 0, SW, SH]], [5.6, [1180, 420, 1100, 619]], [8, [1250, 470, 990, 557]]]))
    for (const p of pins) {
      const [sx, sy] = w.toStage(...p.at)
      p.rings.forEach((r, i) => {
        const ph = ((t - p.t0 - i * 0.33) % 1 + 1) % 1, vis = t > p.t0 + i * 0.33
        const d = 20 + ph * 110
        css(r, { width: d + 'px', height: d + 'px', opacity: vis ? (1 - ph) * 0.9 : 0 })
        place(r, sx - d / 2, sy - d / 2)
      })
      const pp = E.outBack(prog(t, p.t0 + 0.15, p.t0 + 0.6))
      p.pill.style.opacity = clamp(pp)
      place(p.pill, sx - 60, sy + 34 + (1 - pp) * 30, `scale(${0.7 + 0.3 * pp})`)
    }
    // cursor heads for Konza and clicks
    cursor(t, [[6.6, [1250, 960]], [7.5, w.toStage(kona[0] + 6, kona[1] + 6)]], 6.5, 7.95, 7.55)
  }
})

// =====================================================================================
// 8-12 s  Greenness over time
// =====================================================================================
scene(8, 12, (root) => {
  const kick = words(root, '<b>02</b>Greenness over time', 'kicker', WX, 70)
  const head = words(root, 'Every plot, <span class="hl">13 years</span> from space.', 'heading', WX, 104)
  const w = browserWindow(root, ['greenness'], WX, WY, VW, VH)
  const chart = R.greenness.chart[0]
  const scrub = el('div', 'scrub', root), tag = el('div', 'scrub-tag', root)
  const chips = [
    ['556', 'cloud-free<br>satellite readings', '#3fae6a', '50%'],
    ['32', 'soil sampling<br>visits', '#ea580c', '3px'],
    ['11', 'aerial photos<br>per plot', 'transparent', '50%'],
  ].map(([n, l, c, rad], i) => {
    const e = el('div', 'chip', root, `<span class="dot" style="background:${c};border-radius:${rad};${i === 2 ? 'border:4px solid #60a5fa' : ''}${i === 1 ? ';transform:rotate(45deg)' : ''}"></span><span class="n">${n}</span><span class="l">${l}</span>`)
    return e
  })
  // x pixel of a year on the chart axis (measured from the screenshot: 2012 at 121 px, 84.4 px per year)
  const yearX = (y) => 121 + (y - 2012) * 84.45
  return (t) => {
    kick.update(t, 8.05, 12.2); head.update(t, 8.1, 12.2, 0.07)
    const ent = E.outExpo(prog(t, 7.95, 8.5))
    w.win.style.transform = `translateX(${(1 - ent) * 300}px) scale(${0.92 + 0.08 * ent})`
    w.camera(kf(t, [[8.0, [0, 30, SW, SH]], [8.7, [0, 30, SW, SH]], [9.4, [10, 400, 1390, 782]], [12, [70, 430, 1250, 703]]]))
    // scrubber sweeps through the years
    const sp = E.inout3(prog(t, 9.5, 11.7)), year = 2013 + sp * 13.5
    const [sx, top] = w.toStage(yearX(year), chart[1] + 60), [, bot] = w.toStage(0, chart[1] + 330)
    const vis = life(t, 9.45, 12, 0.2, 0.2)
    css(scrub, { height: bot - top + 'px', opacity: vis }); place(scrub, sx - 2, top)
    tag.textContent = Math.floor(year); css(tag, { opacity: vis }); place(tag, sx, top - 52)
    chips.forEach((c, i) => {
      const p = E.outBack(prog(t, 9.0 + i * 0.22, 9.5 + i * 0.22)), o = 1 - E.in3(prog(t, 11.75, 12))
      c.style.opacity = clamp(p) * o
      place(c, 1515 + (1 - p) * 120, 300 + i * 132, `scale(${0.8 + 0.2 * p})`)
    })
  }
})

// =====================================================================================
// 12-14 s  Map layers: aerial photo vs. satellite greenness map
// =====================================================================================
scene(12, 14, (root) => {
  const kick = words(root, '<b>03</b>On the map', 'kicker', 120, 360)
  const h1 = words(root, 'Aerial photo', 'heading', 120, 400)
  const h2 = words(root, '<span class="hl">⇄</span> greenness map', 'heading', 120, 484)
  const sub = words(root, 'Pick any date. Click to read a single spot.', 'sub', 120, 590)
  const m = R.greenness.map[0], S = 0.6
  const aerial = tile(root, 'greenness', m, S)
  const ndvi = tile(root, 'greenness-map', m, S)
  const legend = tile(root, 'greenness-map', R['greenness-map'].legend[0], 1.0)
  const read = el('div', 'pill', root, 'Greenness here: <span style="color:#1f6f43">0.81</span>')
  return (t) => {
    kick.update(t, 12.05, 14.2); h1.update(t, 12.1, 14.2); h2.update(t, 12.2, 14.2); sub.update(t, 12.35, 14.2, 0.03)
    const a = E.outBack(prog(t, 11.98, 12.5)), b = E.outBack(prog(t, 12.2, 12.75))
    aerial.style.opacity = clamp(a); place(aerial, 990 + (1 - a) * 400, 150, `rotate(${-5 + (1 - a) * 12}deg) scale(${0.9 + 0.1 * a})`)
    ndvi.style.opacity = clamp(b); place(ndvi, 1260 + (1 - b) * 400, 175, `rotate(${3 + (1 - b) * 12}deg) scale(${0.9 + 0.1 * b})`)
    const l = E.outBack(prog(t, 12.7, 13.1))
    legend.style.opacity = clamp(l); place(legend, 1120, 790 + (1 - l) * 60, `rotate(-2deg) scale(${0.85 + 0.15 * l})`)
    const r = E.outBack(prog(t, 13.35, 13.65))
    read.style.opacity = clamp(r); place(read, 1430, 520 - (1 - r) * 20, `scale(${0.7 + 0.3 * r})`)
    cursor(t, [[12.8, [1800, 900]], [13.3, [1560, 610]]], 12.75, 13.95, 13.32)
  }
})

// =====================================================================================
// 14-18 s  Soil microbes
// =====================================================================================
scene(14, 18, (root) => {
  const kick = words(root, '<b>04</b>Soil microbes', 'kicker', 110, 70)
  const head = words(root, 'Who lives in <span class="hl">your soil?</span>', 'heading', 110, 104)
  const sub = words(root, 'Bacteria, archaea and fungi · by phylum, class or genus · every sample', 'sub', 110, 196)
  const MF = R['microbes-fungi'], S = 1700 / 1325
  const controls = tile(root, 'microbes-fungi', MF.controls[0], 1.0)
  const bar = tile(root, 'microbes-fungi', [MF.segBar[0][0] - 10, MF.segBar[0][1] - 10, 1345, 62], S)
  const rows = MF.row.slice(0, 6).map((r, i) => {
    const e = tile(root, 'microbes-fungi', r, S); e.style.borderRadius = i === 0 ? '12px 12px 0 0' : i === 5 ? '0 0 12px 12px' : '0'
    e.style.boxShadow = '0 18px 40px rgba(0,0,0,.25)'
    return e
  })
  const glow = el('div', 'glow', root)
  const pill = el('div', 'pill', root, '↑ <i>Fusarium</i><small>16% of fungal DNA · 3,787 reads</small>')
  return (t) => {
    kick.update(t, 14.05, 18.2); head.update(t, 14.1, 18.2); sub.update(t, 14.3, 18.2, 0.025)
    const c = E.outBack(prog(t, 14.25, 14.75))
    controls.style.opacity = clamp(c); place(controls, 110, 270 + (1 - c) * 40, `scale(${0.95 + 0.05 * c})`)
    const bp = E.outExpo(prog(t, 14.55, 15.5))
    bar.style.clipPath = `inset(0 ${(1 - bp) * 100}% 0 0 round 12px)`; place(bar, 110, 466)
    bar.style.opacity = prog(t, 14.5, 14.6)
    rows.forEach((r, i) => {
      const p = E.outExpo(prog(t, 15.0 + i * 0.09, 15.6 + i * 0.09))
      r.style.opacity = clamp(p * 1.4); place(r, 110 + (1 - p) * 500, 568 + i * 45 * S)
    })
    // spotlight the top genus
    const g = life(t, 16.3, 18.2, 0.35, 0.3, E.outBack)
    const gy = 568 + 1 * 45 * S
    css(glow, { width: 1700 + 16 + 'px', height: 45 * S + 16 + 'px', opacity: clamp(g) }); place(glow, 110 - 8, gy - 8)
    pill.style.opacity = clamp(g); place(pill, 130, 568 + 6 * 45 * S + 26 + (1 - g) * 20, `scale(${0.8 + 0.2 * g})`)
    cursor(t, [[15.9, [1500, 1000]], [16.4, [600, gy + 30]]], 15.85, 17.9, 16.45)
  }
})

// =====================================================================================
// 18-21 s  Soil functions: decision cards
// =====================================================================================
scene(18, 21, (root) => {
  const kick = words(root, '<b>05</b>Soil functions', 'kicker', 0, 62)
  const head = words(root, 'What can your soil <span class="hl">do for you?</span>', 'heading', 0, 96)
  const sub = words(root, 'Plain-language cards · what it means · what you can do · how sure we are', 'sub', 0, 190)
  for (const x of [kick, head, sub]) css(x.box, { width: '1920px', textAlign: 'center' })
  const S = 0.98, cardR = R.functions.card
  const cards = cardR.map((r) => tile(root, 'functions', r, S))
  const cw = cardR[0][2] * S, ch = cardR[0][3] * S, gap = 26
  const pos = cards.map((_, i) => i < 3
    ? [960 - (3 * cw + 2 * gap) / 2 + i * (cw + gap), 262]
    : [960 - (2 * cw + gap) / 2 + (i - 3) * (cw + gap), 262 + ch + gap])
  const badges = R.functions.statusBadge
  const stamps = [0, 4].map((i) => ({ i, e: el('div', 'glow', root) }))
  return (t) => {
    kick.update(t, 18.05, 21.2); head.update(t, 18.1, 21.2, 0.06); sub.update(t, 18.35, 21.2, 0.025)
    cards.forEach((c, i) => {
      const p = E.outBack(prog(t, 18.2 + i * 0.13, 18.75 + i * 0.13))
      const [x, y] = pos[i], rot = (i - 2) * 6 * (1 - p)
      c.style.opacity = clamp(p * 1.3)
      place(c, x, y + (1 - p) * 520, `rotate(${rot}deg) scale(${0.85 + 0.15 * p})`)
    })
    // pulse the "Watch" badges
    for (const s of stamps) {
      const b = badges[s.i], card = cardR[s.i], [x, y] = pos[s.i]
      const bx = x + (b[0] - card[0]) * S, by = y + (b[1] - card[1]) * S
      const ph = life(t, 19.6 + (s.i ? 0.2 : 0), 21.1, 0.3, 0.25, E.outBack)
      css(s.e, { width: b[2] * S + 16 + 'px', height: b[3] * S + 16 + 'px', opacity: clamp(ph), borderColor: '#fbbf24', boxShadow: '0 0 30px rgba(251,191,36,.8)' })
      place(s.e, bx - 8, by - 8, `scale(${0.6 + 0.4 * ph + 0.06 * Math.sin(t * 14)})`)
    }
  }
})

// =====================================================================================
// 21-24 s  Nitrogen cycle
// =====================================================================================
scene(21, 24, (root) => {
  const kick = words(root, '<b>06</b>The nitrogen story', 'kicker', 132, 62)
  const head = words(root, 'Follow the <span class="hl">nitrogen.</span>', 'heading', 132, 96)
  const nc = R['functions-ncycle'].ncycle[0], S = 1.25, X = 132, Y = 222
  const diagram = tile(root, 'functions-ncycle', nc, S)
  const box = R['functions-ncycle'].ncBox  // 0 air, 1 urea, 2 ammonium, 3 nitrate, 4 N2O, 5 N2
  const toStage = (r) => [X + (r[0] - nc[0]) * S, Y + (r[1] - nc[1]) * S, r[2] * S, r[3] * S]
  const steps = [
    { b: 1, t0: 21.75, text: 'Fertiliser & manure', color: '#b5f26b' },
    { b: 2, t0: 22.3, text: 'Ammonium · kept in the field', color: '#b5f26b' },
    { b: 3, t0: 22.85, text: 'Nitrate · washes out with rain', color: '#fbbf24' },
    { b: 4, t0: 23.35, text: 'N₂O · greenhouse gas', color: '#fb923c' },
  ].map((s) => ({ ...s, r: toStage(box[s.b]), glow: el('div', 'glow', root), pill: el('div', 'pill', root, s.text) }))
  const particle = el('div', 'abs', root)
  css(particle, { width: '26px', height: '26px', borderRadius: '50%', background: '#fff', boxShadow: '0 0 0 6px rgba(181,242,107,.5), 0 0 40px #b5f26b', zIndex: 5 })
  return (t) => {
    kick.update(t, 21.05, 24.2); head.update(t, 21.1, 24.2)
    const rv = E.outExpo(prog(t, 20.95, 21.7))
    diagram.style.clipPath = `circle(${rv * 120}% at 50% 50%)`
    const z = 1 + 0.035 * prog(t, 21, 24)
    place(diagram, X, Y, `scale(${z})`); diagram.style.transformOrigin = '50% 50%'
    let current = null
    steps.forEach((s, i) => {
      const next = steps[i + 1]
      const on = life(t, s.t0, next ? next.t0 + 0.1 : 24.1, 0.25, 0.2, E.outBack)
      const [x, y, w, h] = s.r
      css(s.glow, { width: w + 20 + 'px', height: h + 20 + 'px', opacity: clamp(on), borderColor: s.color, boxShadow: `0 0 0 6px ${s.color}44, 0 0 44px ${s.color}` })
      place(s.glow, x - 10, y - 10)
      s.pill.style.opacity = clamp(on)
      const below = s.b === 4 || s.b === 1
      place(s.pill, x + w / 2 - 170, below ? y + h + 22 : y - 74, `scale(${0.8 + 0.2 * on})`)
      if (t >= s.t0) current = i
    })
    // a nitrogen atom travels box to box
    const centers = steps.map((s) => [s.r[0] + s.r[2] / 2, s.r[1] + s.r[3] / 2])
    const path = [[21.6, centers[0]], [21.75, centers[0]], [22.3, centers[1]], [22.85, centers[2]], [23.35, centers[3]], [24, centers[3]]]
    const [px, py] = kf(t, path, E.inout3)
    particle.style.opacity = life(t, 21.6, 24, 0.2, 0.2)
    place(particle, px - 13, py - 13)
  }
})

// =====================================================================================
// 24-26 s  Sampling visit page
// =====================================================================================
scene(24, 26, (root) => {
  const kick = words(root, '<b>07</b>Sampling visits', 'kicker', 110, 400)
  const head = words(root, 'Every visit,', 'heading', 110, 440)
  const head2 = words(root, '<span class="hl">one click</span> away.', 'heading', 110, 524)
  const ev = R.event
  const S = 0.92
  const parts = [ev.pageHead[0], ...ev.evCard].map((r) => tile(root, 'event', [r[0] - 12, r[1] - 8, r[2] + 24, r[3] + 16], S))
  const ys = [120, 228, 432, 624]
  return (t) => {
    kick.update(t, 24.05, 26.2); head.update(t, 24.1, 26.2); head2.update(t, 24.2, 26.2)
    parts.forEach((p, i) => {
      const a = E.outExpo(prog(t, 24.1 + i * 0.12, 24.7 + i * 0.12))
      p.style.opacity = clamp(a * 1.3)
      place(p, 790 + (1 - a) * 600, ys[i] + 50, `rotate(${(1 - a) * 4}deg)`)
    })
  }
})

// =====================================================================================
// 26-30 s  Outro
// =====================================================================================
scene(26, 30, (root) => {
  const logo = lockup(root, 1000)
  const tag = el('div', 'sub abs', root, 'Your fields, <b style="color:#b5f26b;font-weight:700">from orbit to the microbe.</b>')
  css(tag, { width: '1920px', textAlign: 'center', fontSize: '40px' })
  const feats = [
    ['#3fae6a', 'Satellite greenness'], ['#60a5fa', 'Aerial photos'], ['#fbbf24', 'Soil microbes'], ['#b5f26b', 'Soil functions'], ['#ea580c', 'Sampling visits'],
  ].map(([c, l]) => el('div', 'tag', root, `<span class="dot" style="background:${c}"></span>${l}`))
  const facts = el('div', 'abs', root, '29 plots &nbsp;·&nbsp; 2 NEON sites &nbsp;·&nbsp; 2013 – 2026 &nbsp;·&nbsp; one map')
  css(facts, { width: '1920px', textAlign: 'center', fontSize: '26px', letterSpacing: '.12em', textTransform: 'uppercase', color: '#8fb09c', fontWeight: 500 })
  const fade = el('div', 'abs', root); css(fade, { width: '1920px', height: '1080px', background: '#000' })
  let widths = null
  return (t) => {
    logo.set(E.inout3(prog(t, 26.05, 26.8)), E.outBack(prog(t, 26.15, 27.0)))
    place(logo.box, 960 - logo.width / 2, 300)
    const sp = E.out3(prog(t, 26.6, 27.1)); tag.style.opacity = sp; place(tag, 0, 525 + (1 - sp) * 20)
    widths ??= feats.map((f) => f.offsetWidth)
    const total = widths.reduce((a, b) => a + b, 0) + 18 * (feats.length - 1)
    let x = 960 - total / 2
    feats.forEach((f, i) => {
      const p = E.outBack(prog(t, 27.0 + i * 0.12, 27.45 + i * 0.12))
      f.style.opacity = clamp(p); place(f, x, 650 + (1 - p) * 40, `scale(${0.7 + 0.3 * p})`)
      x += widths[i] + 18
    })
    const fp = E.out3(prog(t, 27.8, 28.3)); facts.style.opacity = fp; place(facts, 0, 790 + (1 - fp) * 15)
    fade.style.opacity = E.in3(prog(t, 29.3, 30))
  }
})

// ---------- overlays shared by all scenes ----------
const cur = el('div', '', stage); cur.id = 'cursor'
cur.innerHTML = '<svg viewBox="0 0 24 24" width="44" height="44"><path d="M4 2l15 11-7 1 4 8-3 1.5-4-8-5 5z" fill="#fff" stroke="#0b1a12" stroke-width="1.5" stroke-linejoin="round"/></svg>'
const rip = el('div', '', stage); rip.id = 'ripple'
let cursorSet = false
/** Move the pointer along keyframes [[t, [x, y]], ...]; visible in [a, b]; click at `click`. */
function cursor(t, path, a, b, click) {
  if (t < a || t > b) return
  cursorSet = true
  const [x, y] = kf(t, path, E.inout3)
  const press = click != null ? 1 - 0.15 * Math.sin(Math.PI * prog(t, click - 0.05, click + 0.12)) : 1
  css(cur, { display: 'block', opacity: life(t, a, b, 0.15, 0.15) })
  place(cur, x - 6, y - 4, `scale(${press})`)
  if (click != null && t >= click && t < click + 0.5) {
    const p = prog(t, click, click + 0.5)
    css(rip, { display: 'block', opacity: 1 - p }); place(rip, x, y, `scale(${0.3 + E.out3(p) * 1.2})`)
  }
}

const wipe = el('div', '', stage); wipe.id = 'wipe'; el('div', 'edge', wipe)
const WIPES = [[4, '#1f6f43'], [8, '#14532d'], [12, '#1f6f43'], [14, '#92400e'], [18, '#14532d'], [24, '#1e3a5f'], [26, '#1f6f43']]
const progress = el('div', '', stage); progress.id = 'progress'

// ---------- frame ----------
function seek(t) {
  t = clamp(t, 0, DURATION - 1e-6)
  // background drift
  place(blobA, -200 + Math.sin(t * 0.35) * 220, -300 + Math.cos(t * 0.27) * 160)
  place(blobB, 1300 + Math.cos(t * 0.31) * 200, 500 + Math.sin(t * 0.4) * 160)
  dots.style.transform = `translate(${(-t * 18) % 44}px, ${(-t * 9) % 44}px)`
  // beat pulse on the dot grid (120 bpm from 2 s)
  dots.style.opacity = 0.6 + (t >= 2 && t < 28 ? 0.4 * (1 - prog((t - 2) % 0.5, 0, 0.3)) : 0)

  cursorSet = false
  css(rip, { display: 'none' })
  for (const s of scenes) {
    const on = t >= s.start && t < s.end
    s.root.style.display = on ? 'block' : 'none'
    if (on) s.update(t)
  }
  if (!cursorSet) cur.style.display = 'none'

  // diagonal wipe across scene cuts
  const w = WIPES.find(([b]) => Math.abs(t - b) < 0.24)
  if (w) {
    const p = E.inout3(prog(t, w[0] - 0.24, w[0] + 0.24))
    css(wipe, { display: 'block', background: w[1] })
    wipe.style.transform = `translateX(${lerp(-2900, 2100, p)}px) skewX(-14deg)`
  } else wipe.style.display = 'none'
  progress.style.width = (t / DURATION) * 1920 + 'px'
}
window.seek = seek
window.DURATION = DURATION
window.FPS = FPS

// ---------- preview player ----------
const ready = Promise.all([...document.images].map((i) => i.decode().catch(() => {})))
window.ready = ready.then(() => document.fonts.ready).then(() => true)
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render')
} else {
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 34) / 1080); stage.style.transform = `scale(${s})`; document.getElementById('fit').style.bottom = '34px' }
  addEventListener('resize', fit); fit()
  let t = Number(new URLSearchParams(location.search).get('t') ?? 0), playing = true, last = performance.now()
  const loop = (now) => {
    if (playing) { t += (now - last) / 1000; if (t >= DURATION) t = 0 }
    last = now
    seek(t)
    document.getElementById('time').textContent = t.toFixed(2) + ' s'
    document.getElementById('bar').style.width = (t / DURATION) * 100 + '%'
    requestAnimationFrame(loop)
  }
  window.ready.then(() => requestAnimationFrame(loop))
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing = !playing
    if (e.code === 'ArrowRight') { playing = false; t = Math.min(DURATION - 0.01, t + 1 / FPS) }
    if (e.code === 'ArrowLeft') { playing = false; t = Math.max(0, t - 1 / FPS) }
  })
  document.getElementById('track').addEventListener('pointerdown', (e) => {
    const r = e.currentTarget.getBoundingClientRect(); t = ((e.clientX - r.left) / r.width) * DURATION
  })
}
</script>
