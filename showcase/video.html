<!doctype html>
<!--
  Terranos: 66-second showcase video, written as code. No logo cards: it opens on the app and ends on the story.
  Every frame is a pure function of time: seek(t) lays out the whole stage for second t.
  - Open this file in a browser to watch it play (Space pauses, arrow keys step, click the bar to scrub, ?t=12 starts at 12 s).
  - showcase/render.mjs calls seek() frame by frame and pipes screenshots into ffmpeg.
  The app screens are real captures of the GUI (showcase/capture.mjs), with element positions in shots/rects.js.

  Storyboard (video time; the scenes are written in scene time = video time + 4, plus the holds before them)
     0 –  6  01 plot selection: list and map (2 s hold on the hovered plot)
     6 – 16  02 soil microbes: taxonomy, then roles (2 s holds on the table and on the role tree)
    16 – 24  03 soil characteristics (2 s hold on the cards)
    24 – 28  hold ends; break: soil DNA (double helix) and map layers flow through Terranos into the app's outputs (to 36)
    36 – 44  04 crop disease risk (2 s hold on the heatmap)
    44 – 66  break: two neighbours. One checks the crop disease risk (corn high, sugar beet low) and plants beet, which shoots up;
             the other plants corn anyway; a soil pathogen infects its roots (close-up under the ground), red veins climb the stalk and it falls ill;
             he finally listens and buys from the treatment plan; everyone is happy
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terranos showcase</title>
<style>
  :root {
    --ink: #0b1a12; --deep: #0f2a1c; --green: #1f6f43; --leaf: #34a865; --lime: #b5f26b;
    --amber: #f59e0b; --sky: #60a5fa; --cream: #f3f7f1; --soft: #b9d3c3; --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  body { font-family: 'Roboto', system-ui, sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased; }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); transform-origin: 50% 50%; }
  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; inset: 0; display: none; }
  svg.abs { overflow: visible; }

  /* background */
  #bg { position: absolute; inset: 0;
    background: radial-gradient(1200px 800px at 20% 10%, #16402a 0%, transparent 60%),
                radial-gradient(1000px 700px at 90% 100%, #123524 0%, transparent 60%), var(--ink); }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: .45; }
  #dots { position: absolute; inset: -60px;
    background-image: radial-gradient(rgba(181,242,107,.16) 1.4px, transparent 1.6px); background-size: 44px 44px; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }

  /* text */

  .kicker b { color: var(--cream); opacity: .55; font-weight: 700; margin-right: 14px; }
  .heading { font-size: 72px; font-weight: 900; letter-spacing: -0.025em; line-height: 1.02; white-space: nowrap; }
  .sub { font-size: 28px; font-weight: 300; color: var(--soft); white-space: nowrap; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
  .mask > span { display: inline-block; will-change: transform; }
  .hl { color: var(--lime); }
  .center { width: 1920px; text-align: center; }

  /* browser window around a screenshot */
  .win { position: absolute; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); transform-origin: 50% 0%; }
  .win .bar { height: 44px; background: #eef1ec; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid #dde2db; }

  .win .url { margin-left: 18px; flex: 1; max-width: 520px; height: 26px; border-radius: 13px; background: #fff; color: #5b665f;
    font-size: 14px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }

  .vp img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .vp .layer { position: absolute; inset: 0; }

  /* crop of a screenshot shown as a floating tile */
  .tile { position: absolute; left: 0; top: 0; background-repeat: no-repeat; border-radius: 12px; background-color: #fff;
    box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.05); transform-origin: 0 0; }

  /* annotations */
  .ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 4px solid var(--lime); }
  .glow { position: absolute; left: 0; top: 0; border-radius: 12px; border: 4px solid var(--lime);
    box-shadow: 0 0 0 6px rgba(181,242,107,.25), 0 0 40px rgba(181,242,107,.55); }
  .pill { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 700;
    background: var(--cream); color: var(--ink); box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .pill small { font-weight: 400; color: #4b5a51; margin-left: 8px; font-size: 20px; }
  .chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-radius: 18px; white-space: nowrap;
    background: rgba(12,32,22,.9); border: 1px solid rgba(181,242,107,.25); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .chip .n { font-size: 42px; font-weight: 900; letter-spacing: -0.02em; }
  .chip .l { font-size: 21px; color: var(--soft); line-height: 1.15; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .tag { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; font-size: 26px; font-weight: 700;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); white-space: nowrap; position: absolute; left: 0; top: 0; }
  #cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  #ripple { position: absolute; left: 0; top: 0; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 4px solid #fff; z-index: 49;
    box-shadow: 0 0 0 2px rgba(0,0,0,.25); }

  /* data-flow break */
  .particle { position: absolute; left: 0; top: 0; font: 900 22px/1 'Roboto Mono', ui-monospace, monospace; }
  .px { width: 12px; height: 12px; border-radius: 2px; }
  .geo-layer { position: absolute; width: 300px; height: 300px; left: -150px; top: -150px; border-radius: 10px; overflow: hidden;
    border: 2px solid rgba(181,242,107,.55); box-shadow: 0 30px 60px rgba(0,0,0,.35); background-repeat: no-repeat; }
  .out-card { position: absolute; left: 0; top: 0; width: 500px; height: 128px; display: flex; align-items: center; gap: 20px; padding: 9px;
    border-radius: 18px; background: rgba(12,32,22,.92); border: 1px solid rgba(181,242,107,.25); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .out-card .thumb { position: relative; width: 200px; height: 110px; border-radius: 10px; flex: none; background-repeat: no-repeat; background-color: #fff; }
  .out-card b { display: block; font-size: 27px; font-weight: 800; }
  .out-card span { display: block; font-size: 19px; color: var(--soft); margin-top: 4px; }
  .label-block .kicker { font-size: 20px; }
  .label-block .sub { font-size: 22px; margin-top: 6px; }

  /* two-neighbours story */
  .rcard { position: absolute; left: 0; top: 0; width: 780px; padding: 30px 36px 26px; border-radius: 28px; background: #fff; color: #16231b;
    box-shadow: 0 40px 120px rgba(11,26,18,.4); transform-origin: 0 50%; }
  .rcard .hd { display: flex; align-items: center; gap: 24px; white-space: nowrap; }
  .rcard .hd img { height: 42px; }
  .rcard .hd b { font-size: 26px; color: #1f6f43; border-bottom: 4px solid #1f6f43; padding: 6px 0; }
  .rcard .lab { margin-top: 20px; font-size: 17px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5f6f66; white-space: nowrap; }
  .rcard .row { position: relative; display: flex; align-items: center; gap: 22px; margin-top: 18px; padding: 14px 18px 14px 22px; border-radius: 18px; background: #f4f7f3; }
  .rcard .ic svg { display: block; overflow: visible; }
  .rcard .nm { flex: 1; font-size: 44px; font-weight: 900; letter-spacing: -.02em; }
  .rcard .cell { padding: 16px 28px; border-radius: 12px; font-size: 28px; font-weight: 800; color: #fff; white-space: nowrap; }
  .rcard .bad .cell { background: #c0262d; } .rcard .good .cell { background: #1f7a45; }
  .rcard .ring { position: absolute; inset: -7px; border-radius: 24px; border: 5px solid; opacity: 0; }
  .rcard .tick { position: absolute; right: -20px; top: -20px; width: 54px; height: 54px; border-radius: 50%; background: #1f7a45; color: #fff;
    font-size: 30px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 0 0 5px #fff, 0 8px 20px rgba(0,0,0,.25); opacity: 0; }
  .rcard .key { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 19px; color: #5f6f66; white-space: nowrap; }
  .rcard .key i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .phone { position: absolute; left: 0; top: 0; width: 540px; height: 880px; border-radius: 64px; background: #15181c;
    box-shadow: 0 50px 120px rgba(11,26,18,.5), inset 0 0 0 3px #30353c; transform-origin: 100% 0; }
  .phone .screen { position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; border-radius: 50px; overflow: hidden; background: #f4f7f3; color: #16231b; }
  .phone .notch { position: absolute; left: 50%; top: 12px; width: 124px; height: 28px; margin-left: -62px; border-radius: 14px; background: #15181c; }
  .phone .appbar { position: absolute; left: 0; right: 0; top: 0; height: 104px; background: #fff; }
  .phone .appbar img { position: absolute; left: 24px; top: 56px; height: 36px; }
  .phone .ptabs { position: absolute; left: 0; right: 0; top: 104px; height: 50px; background: #fff; display: flex; gap: 24px; padding: 10px 24px 0; font-size: 19px; color: #5f6f66;
    border-bottom: 1px solid #dfe5e0; white-space: nowrap; }
  .phone .ptabs b { color: #1f6f43; border-bottom: 4px solid #1f6f43; }
  .phone .crop { position: absolute; left: 24px; top: 168px; font-size: 21px; font-weight: 800; white-space: nowrap; }
  .phone .tile { box-shadow: 0 0 0 1px #dfe5e0, 0 6px 16px rgba(0,0,0,.07); border-radius: 12px; }
  .phone .ordered { position: absolute; left: 0; top: 0; border-radius: 9px; background: #16a34a; color: #fff; font-weight: 800; font-size: 15px;
    display: grid; place-items: center; white-space: nowrap; box-shadow: 0 0 0 3px #fff; }
  .phone .tapring { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 5px solid #1f6f43; }
  .phone .toast { position: absolute; left: 20px; right: 20px; bottom: 30px; padding: 18px 22px; border-radius: 18px; background: #10281a; color: #fff;
    font-size: 21px; font-weight: 700; box-shadow: 0 12px 30px rgba(0,0,0,.3); white-space: nowrap; }
  .phone .toast span { color: var(--lime); margin-right: 8px; }

  #wipe { position: absolute; left: 0; top: -200px; height: 1480px; width: 2700px; z-index: 80; transform-origin: 0 0; }
  #wipe .edge { position: absolute; right: 0; top: 0; bottom: 0; width: 26px; background: var(--lime); }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--leaf), var(--lime)); z-index: 90; }

  /* preview controls (hidden while rendering) */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; background: rgba(0,0,0,.6); display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #ddd; font: 13px system-ui; z-index: 100; }
  #ui .track { flex: 1; height: 6px; background: #333; border-radius: 3px; position: relative; cursor: pointer; }
  #ui .track b { position: absolute; left: 0; top: 0; bottom: 0; background: #b5f26b; border-radius: 3px; }
  body.render #ui { display: none; }
</style>
<script src="shots/rects.js"></script>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<div id="ui"><span id="time">0.00 s</span><div class="track" id="track"><b id="bar"></b></div><span>Space: play/pause · ←/→: step</span></div>
<script>
'use strict'
const FPS = 30, SW = 2400, SH = 1350  // screenshot size in px
// Scenes are written in "scene time". The video starts at scene time 4 (straight into the app tour) and ends at 60
// (the end of the story). At each HOLD [scene time, seconds] the frame freezes so a fully loaded app view can be read.
// Holds are whole bars (2 s at 120 bpm), so music.mjs can map its sections and effects the same way.
const START = 4, END = 60
const HOLDS = [[7.0, 2], [12.6, 2], [16.8, 2], [23.0, 2], [34.55, 2]]
const DURATION = END - START + HOLDS.reduce((a, h) => a + h[1], 0)
/** Video time -> scene time. */
function sceneTime(v) {
  let s = v + START
  for (const [h, d] of HOLDS) { if (s < h) break; if (s < h + d) return h; s -= d }
  return s
}
const R = window.RECTS
const stage = document.getElementById('stage')

// ---------- time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, p) => a + (b - a) * p
const E = {
  lin: (x) => x,
  out3: (x) => 1 - (1 - x) ** 3,
  in3: (x) => x * x * x,
  inout3: (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  outExpo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  outBack: (x) => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2 },
  outElastic: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
}
/** Keyframes [[t, value], ...]; values are numbers or arrays of numbers. */
function kf(t, frames, ease = E.inout3) {
  if (t <= frames[0][0]) return frames[0][1]
  for (let i = 0; i < frames.length - 1; i++) {
    const [t0, v0] = frames[i], [t1, v1] = frames[i + 1]
    if (t <= t1) {
      const p = ease(prog(t, t0, t1))
      return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], p)) : lerp(v0, v1, p)
    }
  }
  return frames.at(-1)[1]
}
/** 0 -> 1 on the way in, 1 -> 0 on the way out: for things that appear at `a` and leave at `b`. */
const life = (t, a, b, inDur = 0.4, outDur = 0.3, ease = E.out3) =>
  Math.min(ease(prog(t, a, a + inDur)), 1 - E.in3(prog(t, b - outDur, b)))
/** Deterministic pseudo-random number in [0, 1) for an integer seed. */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }

// ---------- colour helpers ----------
const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))
const mix = (a, b, p) => { const x = rgb(a), y = rgb(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], clamp(p)))).join(',')})` }
// Greenness colours of the app's map legend (NDVI_RAMP in src/cropfit/overlay.py).
const NDVI = [[0, '#a6763e'], [0.2, '#d9b36c'], [0.4, '#e9e08a'], [0.6, '#8cc45a'], [0.8, '#2f8f3a'], [1, '#0b5a24']]
const ndviColor = (v) => {
  v = clamp(v)
  for (let i = 0; i < NDVI.length - 1; i++) if (v <= NDVI[i + 1][0]) return mix(NDVI[i][1], NDVI[i + 1][1], prog(v, NDVI[i][0], NDVI[i + 1][0]))
  return NDVI.at(-1)[1]
}

// ---------- DOM helpers ----------
function el(tag, cls, parent, html) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (html != null) e.innerHTML = html
  ;(parent ?? stage).appendChild(e)
  return e
}
const css = (e, s) => { for (const k in s) e.style[k] = s[k]; return e }
const place = (e, x, y, extra = '') => { e.style.transform = `translate(${x}px, ${y}px) ${extra}` }
const show = (e, on) => { e.style.display = on ? '' : 'none'; return on }
const NS = 'http://www.w3.org/2000/svg'
function S(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (parent) parent.appendChild(e)
  return e
}
const at = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); return e }
const svgLayer = (parent) => S('svg', { class: 'abs', width: 1920, height: 1080, viewBox: '0 0 1920 1080' }, parent)

/** Words that rise out of a mask one by one. */
function words(parent, html, cls, x, y, center = false) {
  const box = el('div', cls + ' abs' + (center ? ' center' : ''), parent)
  place(box, x, y)
  const parts = html.split(/\s+(?![^<]*>)/)
  box.innerHTML = parts.map((w) => `<span class="mask"><span>${w}</span></span>`).join(' ')
  const inner = [...box.querySelectorAll('.mask > span')]
  return {
    box,
    update(t, start, end, stagger = 0.06, dur = 0.5) {
      inner.forEach((s, i) => {
        const pin = E.outExpo(prog(t, start + i * stagger, start + i * stagger + dur))
        const pout = E.in3(prog(t, end - 0.3, end))
        s.style.transform = `translateY(${(1 - pin) * 110 + pout * -110}%)`
      })
    },
  }
}
/** Kicker, heading and subline of one section, entering at `a` and leaving at `b`. */
function header(parent, { k, h, s }, x, y, center = false) {
  const kw = k && words(parent, k, 'kicker', x, y, center)
  const hw = words(parent, h, 'heading', x, y + 34, center)
  const sw = s && words(parent, s, 'sub', x, y + 126, center)
  return (t, a, b) => { kw?.update(t, a, b); hw.update(t, a + 0.05, b, 0.06); sw?.update(t, a + 0.25, b, 0.025) }
}

/** A crop of a screenshot as a floating card. rect is [x, y, w, h] in screenshot pixels. */
function tile(parent, shot, rect, scale, cls = 'tile') {
  const [x, y, w, h] = rect
  const e = el('div', cls, parent)
  css(e, { width: w * scale + 'px', height: h * scale + 'px', backgroundImage: `url(shots/${shot}.png)`,
    backgroundSize: `${SW * scale}px ${SH * scale}px`, backgroundPosition: `${-x * scale}px ${-y * scale}px` })
  e.w = w * scale; e.h = h * scale
  return e
}

/** Pop a chip/pill in at `a` from the right, out at `b`. */
function popIn(e, t, a, b, x, y, { dx = 140, dy = 0, s0 = 0.8 } = {}) {
  const p = E.outBack(prog(t, a, a + 0.5)), o = 1 - E.in3(prog(t, b - 0.3, b))
  e.style.opacity = clamp(p) * o
  place(e, x + (1 - p) * dx, y + (1 - p) * dy, `scale(${s0 + (1 - s0) * p})`)
}
const chip = (parent, n, l, color) =>
  el('div', 'chip', parent, `<span class="dot" style="background:${color}"></span><span class="n">${n}</span><span class="l">${l}</span>`)
/** A glowing frame around stage rect [x, y, w, h]. */
function glowAt(e, t, a, b, [x, y, w, h], color = '#b5f26b', pad = 8) {
  const g = life(t, a, b, 0.3, 0.25, E.outBack)
  css(e, { width: w + 2 * pad + 'px', height: h + 2 * pad + 'px', opacity: clamp(g), borderColor: color,
    boxShadow: `0 0 0 6px ${color}40, 0 0 40px ${color}99` })
  place(e, x - pad, y - pad, `scale(${0.96 + 0.04 * clamp(g)})`)
  e.style.transformOrigin = '50% 50%'
}

/** A browser window showing screenshots through a movable camera.
 *  shots: names, or [name, dy, clipPath] where dy shifts a scrolled capture into the same (virtual) page coordinates. */
function browserWindow(parent, shots, x, y, vw, vh) {
  const win = el('div', 'win', parent)
  css(win, { width: vw + 'px', height: vh + 44 + 'px', left: x + 'px', top: y + 'px' })
  el('div', 'bar', win, '<i></i><i></i><i></i><div class="url">🔒 localhost · Terranos</div>')
  const vp = el('div', 'vp', win)
  css(vp, { width: vw + 'px', height: vh + 'px' })
  const imgs = {}
  for (const s of shots) {
    const [name, dy = 0, clip] = Array.isArray(s) ? s : [s]
    const i = el('img', '', vp); i.src = `shots/${name}.png`; i.width = SW; i.height = SH; i.dy = dy
    if (clip) i.style.clipPath = clip
    imgs[name] = i
  }
  const layer = el('div', 'layer', vp)
  const cam = { s: 1, tx: 0, ty: 0 }
  return {
    win, vp, imgs, layer,
    /** Fit rect [x, y, w, h] (virtual page px) into the viewport. */
    camera(rect) {
      const [rx, ry, rw, rh] = rect
      cam.s = Math.min(vw / rw, vh / rh)
      cam.tx = vw / 2 - (rx + rw / 2) * cam.s
      cam.ty = vh / 2 - (ry + rh / 2) * cam.s
      for (const i of Object.values(imgs)) i.style.transform = `translate(${cam.tx}px, ${cam.ty + i.dy * cam.s}px) scale(${cam.s})`
    },
    alpha(name, a) { imgs[name].style.opacity = a; imgs[name].style.display = a > 0 ? 'block' : 'none' },
    /** Page point -> stage point (ignores the window's own entrance transform). */
    toStage(px, py) { return [x + cam.tx + px * cam.s, y + 44 + cam.ty + py * cam.s] },
    /** Page rect -> stage rect. */
    rectStage(r) { const [sx, sy] = this.toStage(r[0], r[1]); return [sx, sy, r[2] * cam.s, r[3] * cam.s] },
    /** Page point -> point inside the viewport (for things in `layer`, clipped by the window). */
    toVp(px, py) { return [cam.tx + px * cam.s, cam.ty + py * cam.s] },
    scale: () => cam.s,
  }
}

  })
  const geoLabel = el('div', 'abs label-block', root, '<div class="kicker">Geoinformatic data</div><div class="sub">satellites · terrain · plots</div>')
  // --- Terranos core
  const CORE = [960, 560]
  const halo = el('div', 'abs', root); css(halo, { width: '520px', height: '520px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(181,242,107,.45), rgba(181,242,107,0) 65%)' })

    return { e, c, y: 238 + k * 150, x: 1370 }
  })
  const riskGlow = el('div', 'glow', root)
  // --- particles
  const BASES = 'ACGT', BASE_C = { A: '#fbbf24', C: '#34d399', G: '#60a5fa', T: '#f87171' }
  const dnaP = Array.from({ length: 30 }, (_, i) => { const b = BASES[i % 4]; const e = el('div', 'particle', root, b); e.style.color = BASE_C[b]; return e })
  const geoP = Array.from({ length: 30 }, (_, i) => { const e = el('div', 'particle px', root); e.style.background = ndviColor(0.15 + hash(i + 9) * 0.85); return e })
  const outP = OUT.flatMap((o, k) => Array.from({ length: 6 }, (_, i) => { const e = el('div', 'particle px', root); css(e, { background: o.c, borderRadius: '50%' }); return { e, k, i } }))
  const bez = (p0, c, p1, u) => [0, 1].map((j) => (1 - u) ** 2 * p0[j] + 2 * (1 - u) * u * c[j] + u * u * p1[j])
  /** A stream of particles from src(i) to dst(i), period P, emitted from t0 to t1. */
  function stream(t, list, t0, t1, P, src, ctrl, dst, size = 1) {
    list.forEach((e, i) => {
      const s = t0 + (i / list.length) * P, cyc = Math.floor((t - s) / P), born = s + cyc * P
      if (t < s || born > t1) { e.style.opacity = 0; return }
      const u = (t - born) / P, p0 = src(i), p1 = dst(i), [x, y] = bez(p0, ctrl(i, p0, p1), p1, E.inout3(u))
      e.style.opacity = Math.min(1, u * 6, (1 - u) * 5)
      place(e, x, y, `translate(-50%, -50%) scale(${size * (1 - 0.5 * u)}) rotate(${u * 200}deg)`)
    })
  }

    const phase = (x) => (x - HX0) * 0.024 - t * 2.4
    for (const [j, sgn] of [[0, 1], [1, -1]]) {
      let d = ''
      for (let x = HX0; x <= reveal; x += 6) d += (d ? 'L' : 'M') + x.toFixed(1) + ',' + (HY + sgn * A * Math.sin(phase(x))).toFixed(1)
      at(strands[j], { d: d || 'M0,0', opacity: fadeAll })
    }
    rungs.forEach((r, i) => {
      const x = HX0 + i * (HX1 - HX0) / (N - 1), ph = phase(x), y1 = HY + A * Math.sin(ph), y2 = HY - A * Math.sin(ph), z = Math.cos(ph)
      const vis = x <= reveal ? fadeAll : 0
      at(r.a, { x1: x, y1, x2: x, y2: (y1 + y2) / 2, opacity: vis * 0.9 }); at(r.b, { x1: x, y1: (y1 + y2) / 2, x2: x, y2, opacity: vis * 0.9 })
      at(r.n1, { cx: x, cy: y1, r: 7 + 3 * z, opacity: vis * (0.55 + 0.45 * (z + 1) / 2) })
      at(r.n2, { cx: x, cy: y2, r: 7 - 3 * z, opacity: vis * (0.55 + 0.45 * (1 - z) / 2) })
    })
    const bl = life(t, 24.5, 31.9); bioLabel.style.opacity = bl; place(bioLabel, HX0, HY + 92 + (1 - bl) * 14)
    // map layers
    const sep = 12 + 52 * E.outBack(prog(t, 24.6, 25.4))
    layers.forEach((L, i) => {
      const p = E.outExpo(prog(t, 24.2 + i * 0.15, 24.9 + i * 0.15)), z = i * sep + Math.sin(t * 2 + i) * 4 + (1 - p) * 80
      L.e.style.opacity = clamp(p) * fadeAll
      L.e.style.transform = `translateY(${-z}px) rotateX(58deg) rotateZ(-42deg)`
      const lp = life(t, 25.2 + i * 0.12, 31.9); L.lab.style.opacity = lp
      place(L.lab, 375 + 228, 760 - z - 14 + (1 - lp) * 10)
    })
    const gl = life(t, 24.7, 31.9); geoLabel.style.opacity = gl; place(geoLabel, 160, 932 + (1 - gl) * 14)
    // core
    const cp = E.outBack(prog(t, 24.4, 25.1)), beat = t > 25.5 ? 1 - prog((t - 24) % 0.5, 0, 0.35) : 0
    const charge = prog(t, 25.3, 27.0)
    globe.style.opacity = clamp(cp) * fadeAll
    place(globe, CORE[0] - 115, CORE[1] - 115, `scale(${cp * (1 + 0.05 * beat * charge)}) rotate(${t * 45}deg)`)
    halo.style.opacity = (0.3 + 0.7 * charge) * clamp(cp) * fadeAll; place(halo, CORE[0] - 260, CORE[1] - 260, `scale(${0.9 + 0.15 * beat * charge})`)
    coreRings.forEach((r, i) => {
      const ph = ((t - 25.3 - i * 0.5) % 1.5 + 1.5) % 1.5 / 1.5, vis = t > 25.3 + i * 0.5
      const d = 240 + ph * 260
      css(r, { width: d + 'px', height: d + 'px', opacity: vis ? (1 - ph) * 0.7 * fadeAll : 0 }); place(r, CORE[0] - d / 2, CORE[1] - d / 2)
    })
    const wp = E.out3(prog(t, 25.0, 25.6)); word.style.opacity = wp * fadeAll; place(word, CORE[0] - 165, CORE[1] + 150 + (1 - wp) * 20)
    // inflow
    stream(t, dnaP, 25.1, 30.2, 1.7, (i) => [HX0 + hash(i) * (HX1 - HX0), HY + (hash(i + 3) - 0.5) * 80],
      (i, a, b) => [(a[0] + b[0]) / 2 + 40, a[1] - 40 + hash(i + 7) * 90], () => CORE)
    stream(t, geoP, 25.3, 30.2, 1.7, (i) => [375 + (hash(i + 11) - 0.5) * 220, 720 + (hash(i + 13) - 0.5) * 120],
      (i, a, b) => [(a[0] + b[0]) / 2, a[1] + 40 - hash(i + 5) * 120], () => CORE)
    // outputs
    OUT.forEach((o, k) => {
      const a = 26.6 + k * 0.35, p = E.outBack(prog(t, a, a + 0.55)), focus = E.inout3(prog(t, 30.6, 31.4))
      const isRisk = k === 2
      o.e.style.opacity = clamp(p) * (isRisk ? 1 : 1 - focus) * (isRisk ? 1 - E.in3(prog(t, 31.75, 32)) : 1)
      place(o.e, o.x + (1 - p) * -90, o.y, `scale(${(0.85 + 0.15 * p) * (isRisk ? 1 + 0.08 * focus : 1)})`)
      o.e.style.transformOrigin = '0 50%'
    })
    glowAt(riskGlow, t, 30.6, 31.95, [OUT[2].x, OUT[2].y, 500 * 1.08, 128 * 1.08], '#ef4444', 6)
    riskGlow.style.transform += ` translateY(${-128 * 0.04}px)`
    outP.forEach(({ e, k, i }) => {
      const a = 26.6 + k * 0.35, P = 1.2, s = a + (i / 6) * P
      const cyc = Math.floor((t - s) / P), born = s + cyc * P
      if (t < s || born > 30.4) { e.style.opacity = 0; return }
      const u = (t - born) / P, dst = [OUT[k].x, OUT[k].y + 64]
      const [x, y] = bez(CORE, [1180, (CORE[1] + dst[1]) / 2], dst, E.inout3(u))
      e.style.opacity = Math.min(1, u * 6, (1 - u) * 6)
      place(e, x, y, 'translate(-50%, -50%)')
    })
  }
})

/** The sugar beet: a white, tapering root with a face, under a crown of big leaves on pink stems; the outer two leaves are its arms.
 *  Origin at the ground under the root. Pose as the corn's, with `awn` for the leaves' flutter. */
function makeBeet(parent) {
  const root = S('g', {}, parent)
  const shadow = S('ellipse', { cy: 3, rx: 118, ry: 15, fill: '#1b140e', opacity: 0.2 }, root)
  const lean = S('g', {}, root), grow = S('g', {}, lean), body = S('g', {}, grow)
  const leaf = (par, len, wid, fill) => {
    const g = S('g', {}, par)
    const stem = limb(g, 9, '#8cc44c')
    const blade = S('path', { fill, ...OUT }, g), rib = S('path', { fill: 'none', stroke: '#a9d97a', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.8 }, g)
    return (x, y, side, ang, bend) => {
      tf(g, `translate(${x},${y}) scale(${side},1) rotate(${ang})`)
      const s0 = len * 0.32
      stem(`M0,0 Q${s0 * 0.5},${bend * 0.1} ${s0},${bend * 0.15}`)
      blade.setAttribute('transform', `translate(${s0},${bend * 0.15})`); blade.setAttribute('d', leafD(len - s0, wid, bend))
      rib.setAttribute('d', `M${s0},${bend * 0.15} Q${s0 + (len - s0) * 0.5},${bend * 0.45} ${len - 12},${bend * 1.1}`)
    }
  }
  // the crown of leaves (behind the root): three in the middle, two outer ones as arms
  const crown = S('g', {}, body)
  const inner = [[-24, 230, 60, '#4f9e3f'], [0, 260, 66, '#5cb84a'], [24, 230, 60, '#4f9e3f']].map(([a, len, wid, fill]) => ({ a, f: leaf(crown, len, wid, fill) }))
  const arms = [leaf(body, 200, 56, '#5cb84a'), leaf(body, 200, 56, '#4aa942')]
  // the root
  const BULB = 'M0,-206 C76,-206 112,-168 108,-118 C104,-68 54,-16 0,6 C-54,-16 -104,-68 -108,-118 C-112,-168 -76,-206 0,-206Z'
  S('path', { d: 'M8,0 C14,26 2,40 22,56', fill: 'none', stroke: INK, 'stroke-width': 11, 'stroke-linecap': 'round' }, body)
  S('path', { d: 'M8,0 C14,26 2,40 22,56', fill: 'none', stroke: '#e6dcc0', 'stroke-width': 5, 'stroke-linecap': 'round' }, body)
  S('path', { d: BULB, fill: '#f6f0de', ...OUT }, body)
  S('path', { d: 'M-84,-156 C-96,-120 -86,-90 -62,-58 M84,-156 C96,-120 86,-90 62,-58 M-40,-190 C-54,-150 -50,-90 -26,-30 M40,-190 C54,-150 50,-90 26,-30',
    fill: 'none', stroke: '#ddd0ad', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0.8 }, body)
  S('path', { d: 'M-70,-170 C-90,-140 -96,-110 -92,-84', fill: 'none', stroke: '#fff', 'stroke-width': 10, 'stroke-linecap': 'round', opacity: 0.7 }, body)
  S('ellipse', { cx: 0, cy: -202, rx: 34, ry: 10, fill: '#a9b86a', stroke: INK, 'stroke-width': 4 }, body)
  for (const x of [-64, 64]) S('ellipse', { cx: x, cy: -78, rx: 17, ry: 10, fill: '#ff9a8a', opacity: 0.55 }, body)
  const eyes = [makeEye(body, -34, -116, 19, 23, 9.5), makeEye(body, 34, -116, 19, 23, 9.5)]
  const brows = [-34, 34].map((x) => S('path', { d: 'M-14,0 Q0,-6 14,0', fill: 'none', stroke: INK, 'stroke-width': 6, 'stroke-linecap': 'round' }, S('g', { transform: `translate(${x},-154)` }, body)))
  const mouth = S('path', { fill: '#8a2f2a', ...OUT, 'stroke-width': 4.5 }, S('g', { transform: 'translate(0,-64)' }, body))

  return (p) => {
    tf(root, `translate(${BEET_X + p.dx},${GROUND})`)

    tf(grow, `scale(${p.s / Math.sqrt(p.sy)},${p.s * p.sy})`)
    tf(body, `rotate(${p.head} 0 -100)`)
    inner.forEach(({ a, f }, i) => f(0, -196, 1, -90 + a + p.sway * (i - 1) + p.awn * 0.25 * (i - 1), -14 + 0.4 * p.awn))
    arms[0](-46, -178, -1, p.armL[0] - 42, p.armL[1] * 0.6)
    arms[1](46, -178, 1, p.armR[0] - 42, p.armR[1] * 0.6)

/** A sprout: a kernel with two leaves and a face. play(t, t0, d, x, lookX) pops it up at t0 and lets it go after d seconds. */
function makeSprout(parent, kernel) {
  const sprout = S('g', {}, parent), sproutIn = S('g', {}, sprout)
  S('path', { d: 'M0,2 C-3,-12 3,-22 0,-34', fill: 'none', stroke: INK, 'stroke-width': 13, 'stroke-linecap': 'round' }, sproutIn)
  S('path', { d: 'M0,2 C-3,-12 3,-22 0,-34', fill: 'none', stroke: '#5cb84a', 'stroke-width': 6, 'stroke-linecap': 'round' }, sproutIn)
  const head = S('g', { transform: 'translate(0,-52)' }, sproutIn)
  const leaves = [-1, 1].map((sd) => S('path', { d: leafD(40, 13, 6), fill: sd < 0 ? '#4aa942' : '#5cb84a', ...OUT, 'stroke-width': 4 }, S('g', {}, head)))
  S('path', { d: 'M0,-26 C24,-26 30,4 20,20 C10,30 -10,30 -20,20 C-30,4 -24,-26 0,-26Z', fill: kernel, ...OUT, 'stroke-width': 4 }, head)
  const eyes = [makeEye(head, -9, -2, 6.5, 8, 4), makeEye(head, 9, -2, 6.5, 8, 4)]
  S('path', { d: 'M-6,12 Q0,18 6,12', fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round' }, head)
  // timed in "sprout seconds": 0 pop, 0.55 looks at its farmer, 0.77 squashes down, 1.07 gone (the plant takes over)
  return (t, t0, d, x, lookX) => {
    const u = (t - t0) * (1.07 / d)
    if (!show(sprout, u >= 0 && u < 1.07)) return
    const s = E.outElastic(prog(u, 0, 0.6)), sy = kf(u, [[0, 1.5], [0.25, 1], [0.77, 1], [1.05, 0.5]]), rot = 7 * Math.sin(u * 7) * (1 - prog(u, 0.75, 0.95))
    tf(sprout, `translate(${x},${GROUND - 4})`); tf(sproutIn, `rotate(${rot}) scale(${s / Math.sqrt(sy)},${s * sy})`)
    leaves.forEach((l, i) => tf(l.parentNode, `translate(0,-22) scale(${i ? 1 : -1},1) rotate(${-38 + 10 * Math.sin(u * 7 + i) - 30 * prog(u, 0.77, 1.05)})`))
    eyes.forEach((e) => e(u < 0.55 ? [0, -0.3] : [lookX, -0.2], Math.max(bump(u, 0.53, 0.14), bump(u, 0.85, 0.3)), 1))
  }
}

  const t = sceneTime(v)
  // background drift and the beat pulse on the dot grid run on video time, so they keep moving during a hold
  place(blobA, -200 + Math.sin(v * 0.35) * 220, -300 + Math.cos(v * 0.27) * 160)
  place(blobB, 1300 + Math.cos(v * 0.31) * 200, 500 + Math.sin(v * 0.4) * 160)
  dots.style.transform = `translate(${(-v * 18) % 44}px, ${(-v * 9) % 44}px)`
  dots.style.opacity = 0.6 + 0.4 * (1 - prog(v % 0.5, 0, 0.3))
  fadeOut.style.opacity = 1 - E.out3(prog(v, 0, 0.35)) + E.in3(prog(v, DURATION - 0.8, DURATION))

  cursorSet = false
  css(rip, { display: 'none' })
  for (const s of scenes) {
    const on = t >= s.start && t < s.end
    s.root.style.display = on ? 'block' : 'none'
    if (on) s.update(t)
  }
  if (!cursorSet) cur.style.display = 'none'

  // diagonal wipe across scene cuts
  const w = WIPES.find(([b]) => Math.abs(t - b) < 0.24)
  if (w) {
    const p = E.inout3(prog(t, w[0] - 0.24, w[0] + 0.24))
    css(wipe, { display: 'block', background: w[1] })
    wipe.style.transform = `translateX(${lerp(-2900, 2100, p)}px) skewX(-14deg)`
  } else wipe.style.display = 'none'
  progress.style.width = (v / DURATION) * 1920 + 'px'
}
window.seek = seek
window.DURATION = DURATION
window.FPS = FPS

// ---------- preview player ----------
const ready = Promise.all([...document.images].map((i) => i.decode().catch(() => {})))
window.ready = ready.then(() => document.fonts.ready).then(() => true)
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render')
} else {
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 34) / 1080); stage.style.transform = `scale(${s})`; document.getElementById('fit').style.bottom = '34px' }
  addEventListener('resize', fit); fit()
  let t = Number(new URLSearchParams(location.search).get('t') ?? 0), playing = true, last = performance.now()
  const loop = (now) => {
    if (playing) { t += (now - last) / 1000; if (t >= DURATION) t = 0 }
    last = now
    seek(t)
    document.getElementById('time').textContent = t.toFixed(2) + ' s'
    document.getElementById('bar').style.width = (t / DURATION) * 100 + '%'
    requestAnimationFrame(loop)
  }
  window.ready.then(() => requestAnimationFrame(loop))
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing = !playing
    if (e.code === 'ArrowRight') { playing = false; t = Math.min(DURATION - 0.01, t + 1 / FPS) }
    if (e.code === 'ArrowLeft') { playing = false; t = Math.max(0, t - 1 / FPS) }
  })
  document.getElementById('track').addEventListener('pointerdown', (e) => {
    const r = e.currentTarget.getBoundingClientRect(); t = ((e.clientX - r.left) / r.width) * DURATION
  })
}
</script>
