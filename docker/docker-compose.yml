version: '3.8'

services:
  # 1. Baza danych przestrzennych (PostGIS)
  postgis:
    image: postgis/postgis:15-3.3
    container_name: spatial_postgis
    environment:
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: spatial_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  # 2. Lokalne S3 na pliki rastrowe COG (MinIO)
  minio:
    image: minio/minio:latest
    container_name: spatial_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. Dynamiczny serwer kafelków rastrowych (TiTiler)
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: spatial_titiler
    environment:
      PORT: 8080
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      - minio

volumes:
  postgis_data:
  minio_data:
