[project]
name = "cropfit"
version = "0.1.0"
description = "Reusable data download and processing code (NMDC, NEON, SSURGO, Daymet, CDL, CSB, LUCAS); see AGENT.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2", "pyarrow>=16", "numpy>=1.26", "requests>=2.31",
  "geopandas>=1.0", "pyogrio>=0.9", "shapely>=2.0", "pyproj>=3.6",
  "rasterio>=1.3", "pystac-client>=0.8", "planetary-computer>=1.0",
  "scikit-learn>=1.5", "pyyaml>=6", "python-dotenv>=1.0", "neonutilities>=1.0",
  "matplotlib>=3.9", "pytest>=8",
  "fastapi>=0.115", "uvicorn>=0.30", "pillow>=10", "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
