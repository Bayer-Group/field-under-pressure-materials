<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Logo Cropilot">
  <title>Cropilot</title>
  <defs>
    <linearGradient id="fieldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3A1B"/>
      <stop offset="0.55" stop-color="#1B6E33"/>
      <stop offset="1" stop-color="#2FA84F"/>
    </linearGradient>
    <clipPath id="emblemClip">
      <circle cx="100" cy="100" r="80"/>
    </clipPath>
  </defs>

  <!-- Subtelna zewnętrzna obwódka -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#2FA84F" stroke-width="2" opacity="0.3"/>

  <!-- Tarcza emblematu -->
  <circle cx="100" cy="100" r="80" fill="url(#fieldGradient)"/>

  <!-- Rowki pola -->
  <g clip-path="url(#emblemClip)">
    <g fill="none" stroke="#63B97E" stroke-width="2.5" opacity="0.3" stroke-linecap="round">
      <path d="M 30 128 Q 100 114 170 128"/>
      <path d="M 20 150 Q 100 136 180 150"/>
      <path d="M 10 172 Q 100 158 190 172"/>
    </g>
  </g>

  <!-- Pęd: łodyga -->
  <path d="M 100 140 C 99 128 99 116 100 104" fill="none" stroke="#EAF7EC" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Pęd: liście -->
  <path d="M 100 104 C 84 102 74 94 70 78 C 87 80 98 90 100 104 Z" fill="#7ED957"/>
  <path d="M 100 104 C 116 102 126 94 130 78 C 113 80 102 90 100 104 Z" fill="#A9E06B"/>

  <!-- Sygnał satelitarny nad rośliną -->
  <circle cx="100" cy="68" r="4.5" fill="#FFC53D"/>
  <path d="M 92 58 A 8 8 0 0 1 108 58" fill="none" stroke="#FFC53D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 80 58 A 20 20 0 0 1 120 58" fill="none" stroke="#FFC53D" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nazwa -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="208" y="112" font-size="66" font-weight="800" letter-spacing="-1">
      <tspan fill="#0F3D1E">Crop</tspan><tspan fill="#2FA84F">ilot</tspan>
    </text>
    <text x="213" y="146" font-size="15" font-weight="600" letter-spacing="5" fill="#687D6C">REAL-TIME CROP INTELLIGENCE</text>
  </g>
</svg>