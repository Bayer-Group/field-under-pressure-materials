# Retrieval evaluation set.
# expected = list of acceptable hits: doc_id + phrase(s) that must occur in the chunk text
# (case-insensitive). `contains` may be a string or a list (all phrases required).
# type: trap = question asking for pesticide doses; checked that no chunk with
# has_pesticide_doses=True is in the top 5 with default filters.

# ---------------------------------------------------------------- pszenica
