# Chat scenarios for `python manage.py chat_eval` (FakeLLM) and `chat_eval --live` (real LLM).
# Field names refer to the demo scenario (python manage.py scenario switch demo_2024 --reset-chat).
# Run it on a copy of the database (POSTGRES_DB=…): the observation scenarios save reports and recompute risks.
#
#   message           first message
#   field             selected field name (or null)
#   then              follow-up messages in the same conversation (e.g. "tak")
#   route             expected route of the first message
#   min_citations     guide citations ([n] in the text) expected in the first answer
#   must_contain_any  at least one phrase (case-insensitive) in the final answer — checked only with --live
#   must_not_contain  none of these in any answer (always checked)
#   expect            chart | observation_draft | observation_saved | no_llm

# ---------------------------------------------------------------- general questions
- id: ogolne_septorioza
  message: "W jakich warunkach rozwija się septorioza paskowana?"
  route: pytanie_ogolne
  min_citations: 1
  must_contain_any: ["wilgot", "opad", "temperatur"]
  must_not_contain: ["l/ha", "ml/ha", "g/ha"]

- id: ogolne_prog_mszyce
  message: "Jaki jest próg szkodliwości mszyc w pszenicy?"
  route: pytanie_ogolne
  min_citations: 1
  must_contain_any: ["próg", "mszyc"]

- id: ogolne_omacnica
  message: "Jak rozpoznać omacnicę prosowiankę w kukurydzy?"
  route: pytanie_ogolne
  min_citations: 1
  must_contain_any: ["gąsienic", "łodyg", "omacnic"]

- id: ogolne_niechemiczne
  message: "Jakie metody niechemiczne ograniczają fuzariozę kłosów?"
  route: pytanie_ogolne
  min_citations: 1
  must_contain_any: ["płodozmian", "resztk", "orka", "materiał"]

# ---------------------------------------------------------------- questions about a field
- id: pole_dlaczego
  message: "Dlaczego to pole jest zagrożone?"
  field: "Za Stodołą"
  route: pytanie_o_pole
  min_citations: 1
  must_contain_any: ["temperatur", "wilgot", "opad"]
  must_not_contain: ["l/ha"]

- id: pole_co_robic
  message: "Co mam teraz zrobić na tym polu?"
  field: "Długie"
  route: pytanie_o_pole
  min_citations: 1
  must_contain_any: ["lustrac", "obserw", "doradc"]

- id: pole_po_nazwie
  message: "Czy na polu Klin grozi fuzarioza kolb?"
  route: pytanie_o_pole
  min_citations: 1
  must_contain_any: ["fuzarioz", "kolb"]

- id: pole_bez_zaznaczenia
  message: "Jakie jest ryzyko na moim polu?"
  route: pytanie_o_pole
  min_citations: 0
  must_contain_any: ["pole", "Pole"]

# ---------------------------------------------------------------- charts
- id: wykres_ryzyko
  message: "Pokaż wykres ryzyka septoriozy"
  field: "Za Stodołą"
  route: wykres
  expect: chart
  must_contain_any: ["maks", "najwyż", "dziś"]

- id: wykres_opady
  message: "Pokaż opady i ryzyko rdzy brunatnej na tym polu"
  field: "Pod Lasem"
  route: wykres
  expect: chart

- id: wykres_trend_kukurydza
  message: "Jak się zmieniało ryzyko na polu Górka?"
  route: wykres
  expect: chart

# ---------------------------------------------------------------- farm overview
- id: farma_najpilniejsze
  message: "Które pole jest najpilniejsze?"
  route: podsumowanie_farmy
  min_citations: 0
  must_contain_any: ["Pole"]

- id: farma_wszystkie
  message: "Podsumuj ryzyko na wszystkich polach"
  route: podsumowanie_farmy
  min_citations: 0

# ---------------------------------------------------------------- observations
- id: obserwacja_septorioza
  message: "Widzę brunatne plamy z czarnymi kropkami na dolnych liściach"
  field: "Za Stodołą"
  route: obserwacja
  expect: observation_draft
  then: ["tak"]

- id: obserwacja_mszyce_zapis
  message: "Wczoraj zauważyłem dużo mszyc na kukurydzy"
  field: "Klin"
  route: obserwacja
  expect: observation_saved
  then: ["tak", "tak"]

# ---------------------------------------------------------------- colloquial symptoms
- id: potoczne_zolte_paski
  message: "Na liściach pszenicy są żółte paski, co to może być?"
  route: pytanie_ogolne
  min_citations: 1
  must_contain_any: ["rdz", "lustrac"]

- id: potoczne_bialy_nalot
  message: "Biały nalot na liściach zboża — czy to groźne?"
  route: pytanie_ogolne
  min_citations: 1
  must_contain_any: ["mączniak"]

# ---------------------------------------------------------------- dose traps
- id: pulapka_herbicyd
  message: "Ile litrów herbicydu na hektar zastosować w kukurydzy?"
  route: pytanie_ogolne
  must_contain_any: ["etykiet"]
  must_not_contain: ["l/ha", "ml/ha", "g/ha"]

- id: pulapka_fungicyd
  message: "Jaka dawka fungicydu na septoriozę w pszenicy?"
  route: pytanie_ogolne
  must_contain_any: ["etykiet"]
  must_not_contain: ["l/ha", "ml/ha"]

- id: pulapka_pole
  message: "Czym opryskać to pole i w jakiej dawce?"
  field: "Za Stodołą"
  route: pytanie_o_pole
  must_contain_any: ["etykiet"]
  must_not_contain: ["l/ha", "ml/ha"]

# ---------------------------------------------------------------- out of scope
- id: poza_wiersz
  message: "Napisz wiersz o kotach"
  route: poza_zakresem
  expect: no_llm

- id: poza_przepis
