# Configuration for scripts/load_db.py (target: the PostGIS database, see docker/RAW_SCHEMA.md). CLI flags override these.
# Relative paths are resolved against the repository root.

[database]
backend = "postgis"
# Connection string: put it in the environment, NOT here:
#   PowerShell:  $env:LOAD_DB_DSN = "postgresql://user:password@host:5432/dbname"
#   bash:        export LOAD_DB_DSN="postgresql://user:password@host:5432/dbname"
dsn = ""

[database.options]
schema = "raw"          # the raw layer; tables are looked up with search_path = raw, public

# Tables that live in another schema: logical name = real name ("schema.table")
[tables]
field = "app.field"
field_crop_share = "app.field_crop_share"

[paths]
raw = "data/raw"        # or pass --raw <folder> (e.g. an external disk)
report = "data/db/load_report.json"

[inputs]
# fields = "data/fields.geojson"      # farmer's fields -> field + field_crop_share
# fields_source = "farmer-x"          # stored in field.source (default: the file name)

[datasets]
enabled = ["grid_cell", "weather_hourly", "weather_daily", "imerg_daily", "soil_h3", "cropland_cty",
           "field", "field_crop_share"]

[options]
batch_size = 1_000_000
# Years to load. Needed because some sources (IMERG) hold 2020-2025 on disk; --years overrides it.
years = [2024]
