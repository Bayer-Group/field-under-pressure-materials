<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf3ed" />
  <title>Twoje pola — Field Under Pressure</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="farmer-data.js"></script>
  <style>
    :root { color-scheme: light; --green: #176544; --ink: #15221b; --muted: #66766d; --line: rgba(32,62,45,.10); --paper: rgba(248,251,247,.93); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #e8efe8; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #2d815d; outline-offset: 3px; }
    svg { width: 21px; height: 21px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; isolation: isolate; }
    #map { position: absolute; inset: 0; background: #e6ede3; }
    .top { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; gap: 8px; z-index: 2; }
    .search { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 0 14px; height: 52px; border: 1px solid rgba(255,255,255,.8); border-radius: 17px; background: var(--paper); box-shadow: 0 5px 22px rgba(24,50,35,.12); backdrop-filter: blur(18px); }
    .search svg { width: 19px; color: #42564a; }
    .search input { width: 100%; min-width: 0; padding: 0; color: var(--ink); border: 0; outline: 0; background: transparent; font-size: 15px; }
    .search input::placeholder { color: #69786d; opacity: 1; }
    .locate { width: 52px; height: 52px; display: grid; place-items: center; flex: none; border: 1px solid rgba(255,255,255,.8); border-radius: 17px; background: var(--paper); color: var(--ink); box-shadow: 0 5px 22px rgba(24,50,35,.12); backdrop-filter: blur(18px); }
    .locate:active, .option:active { transform: scale(.985); }
    .sheet { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 10px 20px max(20px, env(safe-area-inset-bottom)); border: 1px solid rgba(255,255,255,.85); border-bottom: 0; border-radius: 28px 28px 0 0; background: rgba(235,246,238,.94); box-shadow: 0 -10px 40px rgba(20,50,33,.14); backdrop-filter: blur(25px); max-height: min(68dvh, 570px); overflow-y: auto; transition: padding 220ms ease, max-height 220ms ease, transform 360ms cubic-bezier(.22,1,.36,1), opacity 220ms ease; }
    .handle { width: 36px; height: 4px; border-radius: 4px; background: #a9bdb0; margin: 1px auto 20px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-size: clamp(25px, 7vw, 30px); letter-spacing: -.045em; line-height: 1.1; margin: 0; }
    .subtitle { color: var(--muted); margin: 7px 0 19px; font-size: 14px; line-height: 1.4; }
    .options { display: grid; gap: 7px; }
    .option { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 15px; text-align: left; border: 1px solid rgba(255,255,255,.9); border-radius: 14px; background: rgba(255,255,255,.74); color: var(--ink); font-size: 14px; font-weight: 650; transition: transform 100ms ease, background 100ms ease; }
    .option .icon { color: var(--green); display: grid; place-items: center; width: 22px; }
    .option .chevron { margin-left: auto; width: 17px; color: #829188; }
    .selected { display: none; margin: 0 0 13px; padding: 12px 14px; border: 1px solid rgba(23,101,68,.14); border-radius: 14px; background: rgba(255,255,255,.66); }
    .selected.visible { display: block; }
    .selected-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .selected-list { margin: 7px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .parcel-chip { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 9px; padding: 5px 8px; background: #e7f1e9; color: #28573d; font-size: 12px; }
    .parcel-chip svg { width: 13px; height: 13px; }
    .field-name { display: grid; gap: 7px; margin-top: 12px; color: #42564a; font-size: 12px; font-weight: 700; }
    .field-name input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid rgba(32,62,45,.14); border-radius: 11px; color: var(--ink); background: rgba(255,255,255,.86); font-size: 14px; font-weight: 500; }
    .primary { width: 100%; min-height: 52px; margin-top: 12px; border: 0; border-radius: 15px; background: #14221a; color: #fff; font-size: 14px; font-weight: 700; }
    .primary:disabled { opacity: .38; cursor: not-allowed; }
    .status { position: absolute; z-index: 3; top: calc(max(16px, env(safe-area-inset-top)) + 61px); left: 16px; right: 16px; margin: 0; padding: 10px 13px; border-radius: 12px; background: #fff; box-shadow: 0 5px 20px rgba(24,50,35,.12); font-size: 13px; line-height: 1.4; }
    .status:empty { display: none; }
    .status { background: rgba(239,247,240,.84); border: 1px solid rgba(255,255,255,.7); backdrop-filter: blur(18px); color: #294c36; }
    .sheet.collapsed { max-height: 61px; overflow: hidden; padding-bottom: 8px; }
    .drawer-content { max-height: 520px; opacity: 1; overflow-y: auto; transition: max-height 220ms ease, opacity 150ms ease; }
    .sheet.collapsed .drawer-content { max-height: 0; opacity: 0; overflow: hidden; pointer-events: none; }
    .drawer-toggle { display: block; width: 100%; border: 0; background: transparent; padding: 1px 0 10px; cursor: pointer; }
    .drawer-toggle .handle { display: block; margin: 1px auto 4px; }
    .drawer-toggle span:last-child { display: none; color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .sheet.collapsed .drawer-toggle span:last-child { display: block; }
    .sheet.search-hidden { transform: translateY(calc(100% + 12px)); opacity: 0; pointer-events: none; }
    .top.searching { position: absolute; z-index: 6; top: 50%; left: 50%; right: auto; width: min(90vw, 440px); transform: translate(-50%, -50%); transition: top 360ms cubic-bezier(.22,1,.36,1), width 360ms cubic-bezier(.22,1,.36,1); }
    .top.searching .locate { display: none; }
    .top.searching .search { height: 60px; box-shadow: 0 12px 40px rgba(24,50,35,.24); }
    .results.searching { position: absolute; z-index: 6; top: calc(50% + 38px); left: 50%; right: auto; width: min(90vw, 440px); max-height: min(42dvh, 360px); overflow: auto; transform: translateX(-50%); }
    .search-backdrop { display: none; position: absolute; inset: 0; z-index: 5; background: rgba(16,35,24,.23); }
    .search-backdrop.visible { display: block; }
    dialog { width: min(90vw, 390px); padding: 24px; border: 1px solid rgba(255,255,255,.9); border-radius: 24px; color: var(--ink); background: rgba(242,249,243,.97); box-shadow: 0 16px 50px rgba(15,40,25,.22); }
    dialog::backdrop { background: rgba(16,35,24,.32); }
    dialog h2 { font-size: 22px; letter-spacing: -.035em; margin: 0 0 8px; }
    dialog p { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .upload-zone { display: flex; align-items: center; justify-content: center; flex-direction: column; min-height: 172px; padding: 20px; margin: 18px 0 10px; text-align: center; border: 1.5px dashed #9bb6a3; border-radius: 16px; background: rgba(255,255,255,.62); cursor: pointer; }
    .upload-zone svg { width: 31px; height: 31px; color: var(--green); margin-bottom: 13px; }
    .upload-zone strong { font-size: 14px; }
    .upload-zone small { color: var(--muted); margin-top: 6px; font-size: 12px; line-height: 1.4; }
    .upload-zone:focus-within { outline: 3px solid #2d815d; outline-offset: 3px; }
    .upload-zone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .selection-rectangle { display: none; position: absolute; z-index: 1; pointer-events: none; border: 1.5px solid var(--green); background: rgba(23,101,68,.16); }
    .selection-rectangle.visible { display: block; }
    dialog .close-dialog { border: 0; padding: 10px 16px; border-radius: 12px; background: #14221a; color: #fff; }
    .maplibregl-ctrl-top-right { top: auto; bottom: calc(var(--drawer-height, 370px) + max(26px, env(safe-area-inset-bottom) + 12px)); right: 16px; transition: bottom 220ms ease; }
    .maplibregl-ctrl-group { border-radius: 17px !important; overflow: hidden; box-shadow: 0 5px 22px rgba(24,50,35,.12) !important; }
    .maplibregl-ctrl-group button { width: 52px !important; height: 52px !important; background: rgba(248,251,247,.94) !important; }

    .results { display: none; position: absolute; z-index: 3; top: calc(max(16px, env(safe-area-inset-top)) + 58px); left: 16px; right: 76px; padding: 6px; border-radius: 14px; background: rgba(250,252,249,.97); box-shadow: 0 5px 20px rgba(24,50,35,.15); backdrop-filter: blur(18px); }
    .results.visible { display: grid; }
    .results button { display: grid; gap: 3px; width: 100%; text-align: left; min-height: 52px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); padding: 8px 10px; }
    .result-title { font-size: 14px; font-weight: 700; }
    .result-meta { color: #596d60; font-size: 12px; }
    .result-id { color: #89948d; font-size: 10px; }
    .results-hint { color: #596d60; padding: 8px 10px 5px; font-size: 12px; }
    .results button:hover { background: #edf5ee; }
    .maplibregl-ctrl-bottom-right { bottom: min(68dvh, 570px); }
    .maplibregl-ctrl-attrib { font-size: 10px !important; }
    @media (min-width: 720px) { .top { left: 24px; right: auto; width: 440px; top: 24px; } .sheet { left: 24px; bottom: 0; right: auto; width: 390px; max-height: calc(100dvh - 115px); border-radius: 25px 25px 0 0; border-bottom: 0; } .sheet.search-hidden { transform: translateY(calc(100% + 12px)); } .maplibregl-ctrl-bottom-right { bottom: 0; } .status { left: 24px; right: auto; width: 440px; top: 84px; } .results { left: 24px; right: auto; width: 380px; top: 82px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="Mapa działek"></div>
    <div id="selection-rectangle" class="selection-rectangle" aria-hidden="true"></div>
    <div id="search-backdrop" class="search-backdrop"></div>
    <div class="top" id="top-controls">
      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
        <input id="parcel-number" aria-label="Wieś, numer działki lub identyfikator" placeholder="Wieś, numer działki lub identyfikator" autocomplete="off" />
      </form>
      <button class="locate" id="locate" type="button" aria-label="Znajdź moją lokalizację"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.5 18-2.7-7.8L3 10.5 21 3Z"/></svg></button>
    </div>
    <div id="results" class="results" aria-label="Wyniki wyszukiwania"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section class="sheet" aria-labelledby="heading">
      <button id="drawer-toggle" class="drawer-toggle" type="button" aria-label="Zwiń panel" aria-expanded="true"><span class="handle" aria-hidden="true"></span><span>Twoje pola</span></button>
      <div id="drawer-content" class="drawer-content">
      <p class="eyebrow">Twoje pola</p>
      <h1 id="heading">Wybierz działkę</h1>
      <p class="subtitle">Połącz kilka działek w jedno pole. Możesz też wskazać je na mapie lub dodać z pliku.</p>
      <div id="selected" class="selected"><div class="selected-head"><span class="dot"></span><span id="selected-count"></span></div><div id="selected-list" class="selected-list"></div><label class="field-name" for="field-name-input">Nazwa pola<input id="field-name-input" maxlength="48" placeholder="np. Za stodołą" autocomplete="off" /></label></div>
      <div class="options">
        <button class="option" id="search-option" type="button"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7 21M17 3l-2 18M4 9h16M3 15h16"/></svg></span><span>Numer działki</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
        <button class="option" id="map-option" type="button"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 10-7 1-3 6L5 3Z"/></svg></span><span>Wybierz na mapie</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
        <button class="option" id="import-option" type="button"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span><span>Importuj plik</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <button id="continue" class="primary" disabled type="button">Dalej</button>
      </div>
    </section>
    <dialog id="import-dialog" aria-labelledby="import-title">
      <h2 id="import-title">Importuj plik</h2>
      <p>Wybierz plik GeoJSON lub spakowany Shapefile (.zip).</p>
      <label class="upload-zone" for="import-file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <strong>Wybierz plik</strong><small>GeoJSON lub Shapefile w pliku ZIP</small>
        <input id="import-file" type="file" accept=".geojson,.json,.zip,application/geo+json,application/zip" aria-label="Wybierz plik GeoJSON lub ZIP" />
      </label>
      <p id="import-note">Import i odczyt pliku będą dostępne w kolejnym etapie.</p>
      <button class="close-dialog" id="close-import" type="button">Zamknij</button>
    </dialog>
  </main>
  <script>
    'use strict';
    const provider = FarmerData.createProvider({ mode: 'mock' });
    const selected = new Map();
    const input = document.getElementById('parcel-number');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const next = document.getElementById('continue');
    const sheet = document.querySelector('.sheet');
    const drawerToggle = document.getElementById('drawer-toggle');
    const topControls = document.getElementById('top-controls');
    const searchBackdrop = document.getElementById('search-backdrop');
    const importDialog = document.getElementById('import-dialog');
    const fieldNameInput = document.getElementById('field-name-input');
    let drawerBeforeSearch = true;
    let searchLocality = null;
    let suggestionTimer = null;
    /** Expand or collapse the selection panel. */
    function setDrawer(open) {
      sheet.classList.toggle('collapsed', !open);
      document.getElementById('drawer-content').inert = !open;
      drawerToggle.setAttribute('aria-expanded', String(open));
      drawerToggle.setAttribute('aria-label', open ? 'Zwiń panel' : 'Otwórz panel');
    }
    /** Open or dismiss the centred parcel search. */
    function setSearch(open) {
      if (open === topControls.classList.contains('searching')) return;
      if (open) drawerBeforeSearch = !sheet.classList.contains('collapsed');
      topControls.classList.toggle('searching', open);
      results.classList.toggle('searching', open);
      searchBackdrop.classList.toggle('visible', open);
      sheet.classList.toggle('search-hidden', open);
      document.getElementById('drawer-content').inert = open || sheet.classList.contains('collapsed');
      if (open) { searchLocality = null; input.value = ''; input.placeholder = 'Wieś, numer działki lub identyfikator'; input.focus(); }
      else { results.classList.remove('visible'); input.blur(); setDrawer(drawerBeforeSearch); }
    }
    drawerToggle.addEventListener('click', () => setDrawer(sheet.classList.contains('collapsed')));
    searchBackdrop.addEventListener('click', () => setSearch(false));
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && topControls.classList.contains('searching')) setSearch(false); });
    const map = new maplibregl.Map({
      container: 'map', center: [20.773, 52.175], zoom: 12.8,
      style: { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '&copy; OpenStreetMap contributors' } }, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] }
    });
    /** Render the selected parcels and their removable labels. */
    function renderSelection() {
      const items = [...selected.values()];
      const count = items.length;
      const parcelWord = count === 1 ? 'działka' : count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 12 || count % 100 > 14) ? 'działki' : 'działek';
      const source = map.getSource('selected-parcels');
      if (source) source.setData({ type: 'FeatureCollection', features: items.map(parcel => ({ type: 'Feature', geometry: parcel.geometry, properties: { id: parcel.parcel_id } })) });
      const panel = document.getElementById('selected');
      panel.classList.toggle('visible', items.length > 0);
      document.getElementById('selected-count').textContent = `Jedno pole · ${count} ${parcelWord}`;
      const list = document.getElementById('selected-list');
      list.replaceChildren();
      items.forEach(parcel => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'parcel-chip';
        button.textContent = `${parcel.parcel_number} · ${parcel.locality || 'działka'} ×`;
        button.setAttribute('aria-label', `Usuń działkę ${parcel.parcel_number}, ${parcel.locality || ''}`);
        button.addEventListener('click', () => { selected.delete(parcel.parcel_id); renderSelection(); });
        list.appendChild(button);
      });
      fieldNameInput.disabled = items.length === 0;
      next.disabled = items.length === 0 || !fieldNameInput.value.trim();
    }
    fieldNameInput.addEventListener('input', renderSelection);
    /** Add a selected result without claiming ownership. */
    function selectParcel(parcel, options = {}) {
      if (options.toggle && selected.has(parcel.parcel_id)) {
        selected.delete(parcel.parcel_id); status.textContent = 'Działka odznaczona.'; renderSelection(); return;
      }
      selected.set(parcel.parcel_id, parcel); results.classList.remove('visible'); status.textContent = 'Działka dodana. Możesz wybrać kolejną.'; renderSelection();
      if (!options.focus) return;
      const bounds = parcel.geometry.coordinates[0].reduce((box, point) => box.extend(point), new maplibregl.LngLatBounds());
      const panel = document.querySelector('.sheet');
      const mobile = window.matchMedia('(max-width: 719px)').matches;
      const bottom = mobile ? Math.min(panel.offsetHeight + 20, Math.max(20, map.getContainer().clientHeight - 140)) : 40;
      map.fitBounds(bounds, { padding: { top: 100, bottom, left: mobile ? 35 : 430, right: 35 }, maxZoom: 15, duration: 450 });
    }
    /** Add a human-readable parcel suggestion with the cadastral ID as secondary detail. */
    function addParcelSuggestion(parcel, options = {}) {
      const button = document.createElement('button');
      const title = document.createElement('span'); title.className = 'result-title'; title.textContent = `Działka ${parcel.parcel_number}`;
      const meta = document.createElement('span'); meta.className = 'result-meta';
      meta.textContent = `${parcel.locality || 'Miejscowość'} · gm. ${parcel.commune || 'gmina'} · ${Number(parcel.area_ha || 0).toFixed(2).replace('.', ',')} ha`;
      const id = document.createElement('span'); id.className = 'result-id'; id.textContent = parcel.cadastral_id || parcel.parcel_id;
      button.type = 'button'; button.append(title, meta, id);
      button.addEventListener('click', () => { setSearch(false); selectParcel(parcel, options); });
      results.appendChild(button);
    }
    /** Offer one or more backend-provided matches for map selection. */
    function showMatches(parcels, autoSelect, options = {}) {
      results.replaceChildren(); results.classList.remove('visible');
      if (!parcels.length) { status.textContent = 'Nie znaleziono działki. Spróbuj ponownie.'; return; }
      if (parcels.length === 1 && autoSelect) { selectParcel(parcels[0], options); return; }
      status.textContent = parcels.length > 1 ? 'Znaleziono kilka działek. Wybierz właściwą.' : 'Wybierz działkę z wyników.';
      parcels.forEach(parcel => addParcelSuggestion(parcel, options));
      results.classList.add('visible');
    }
    /** Show matching parcel suggestions returned by the mock or backend provider. */
    function showSearchParcels(parcels) {
      results.replaceChildren();
      if (!parcels.length) { results.classList.remove('visible'); status.textContent = 'Nie znaleziono działki. Sprawdź wieś, gminę lub numer.'; return; }
      if (parcels.length === 1) { setSearch(false); selectParcel(parcels[0], { focus: true }); return; }
      const hint = document.createElement('div'); hint.className = 'results-hint'; hint.textContent = 'Wybierz miejscowość i działkę.'; results.appendChild(hint);
      parcels.forEach(parcel => addParcelSuggestion(parcel, { focus: true }));
      results.classList.add('visible'); status.textContent = 'Wybierz pasującą działkę. Numer może występować w kilku obrębach.';
    }
    /** Show unique locality choices before a farmer enters the parcel number. */
    function showLocalitySuggestions(parcels) {
      const localities = new Map();
      parcels.forEach(parcel => localities.set(`${parcel.locality}|${parcel.commune}`, parcel));
      results.replaceChildren();
      if (!localities.size) { results.classList.remove('visible'); status.textContent = 'Nie znaleziono miejscowości. Wpisz numer działki lub pełny identyfikator.'; return; }
      const hint = document.createElement('div'); hint.className = 'results-hint'; hint.textContent = 'Wybierz obręb, potem wpisz numer działki.'; results.appendChild(hint);
      localities.forEach(parcel => {
        const button = document.createElement('button'); button.type = 'button';
        const title = document.createElement('span'); title.className = 'result-title'; title.textContent = parcel.locality;
        const meta = document.createElement('span'); meta.className = 'result-meta'; meta.textContent = `gm. ${parcel.commune}`;
        button.append(title, meta);
        button.addEventListener('click', () => {
          searchLocality = { locality: parcel.locality, commune: parcel.commune };
          input.value = ''; input.placeholder = `Numer działki · ${parcel.locality}, gm. ${parcel.commune}`;
          results.classList.remove('visible'); status.textContent = `Wpisz numer działki w obrębie ${parcel.locality}, gm. ${parcel.commune}.`; input.focus();
        });
        results.appendChild(button);
      });
      results.classList.add('visible'); status.textContent = 'Wybierz właściwą miejscowość z listy.';
    }
    /** Search a full identifier, a locality and number, a bare number, or a locality prefix. */
    async function lookupParcelSearch() {
      const term = input.value.trim();
      if (!term) { results.classList.remove('visible'); return; }
      try {
        if (searchLocality && /^\d+(?:\/\d+)?$/.test(term)) {
          const response = await provider.findParcels({ number: term, locality: `${searchLocality.locality} ${searchLocality.commune}` });
          showSearchParcels(response.parcels); return;
        }
        const isId = /^\d{6}_\d\.\d{4}\.\d+(?:\/\d+)?$/.test(term);
        const isNumber = /^\d+(?:\/\d+)?$/.test(term);
        const isCombined = /^.+\s+\d+(?:\/\d+)?$/.test(term);
        const response = await provider.findParcels({ number: term });
        if (isId || isNumber || isCombined) showSearchParcels(response.parcels);
        else showLocalitySuggestions(response.parcels);
      } catch (_) { results.classList.remove('visible'); status.textContent = 'Nie można wyszukać działki. Spróbuj ponownie.'; }
    }
    new ResizeObserver(() => document.documentElement.style.setProperty('--drawer-height', `${sheet.offsetHeight}px`)).observe(sheet);
    map.addControl(new maplibregl.NavigationControl({ showZoom: false, showCompass: true }), 'top-right');
    map.on('load', async () => {
      const selectionColor = getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
      map.addSource('selected-parcels', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'selected-fill', type: 'fill', source: 'selected-parcels', paint: { 'fill-color': selectionColor, 'fill-opacity': .25 } });
      map.addLayer({ id: 'selected-outline', type: 'line', source: 'selected-parcels', paint: { 'line-color': selectionColor, 'line-width': 2.5 } });
      renderSelection();
      try {
        const { fields } = await provider.listFields();
        map.addSource('sample-parcels', { type: 'geojson', data: { type: 'FeatureCollection', features: fields.map(field => ({ type: 'Feature', geometry: field.parcel.geometry, properties: {} })) } });
        map.addLayer({ id: 'sample-outline', type: 'line', source: 'sample-parcels', paint: { 'line-color': '#617b68', 'line-width': 1.1, 'line-opacity': .65 } }, 'selected-fill');
      } catch (_) { status.textContent = 'Nie można pobrać działek. Spróbuj ponownie.'; }
    });
    let suppressMapClick = false;
    // Hold, then draw a marquee; sample the existing point-lookup mock inside it.
    const canvas = map.getCanvas();
    const selectionBox = document.getElementById('selection-rectangle');
    let holdTimer = null, drawing = false, startPoint = null, pointerId = null;
    let anchor = null, cursor = null, panFrame = null, lastFrame = null;
    let rectangleVersion = 0, preview = new Map(), pendingScan = Promise.resolve();
    /** Show the current selection rectangle and return its screen bounds. */
    function updateRectangle() {
      const origin = map.project(anchor);
      const left = Math.min(origin.x, cursor[0]), top = Math.min(origin.y, cursor[1]);
      const right = Math.max(origin.x, cursor[0]), bottom = Math.max(origin.y, cursor[1]);
      Object.assign(selectionBox.style, { left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px` });
      return { left, top, right, bottom };
    }
    /** Query mock parcel points inside the marquee without silently selecting outside it. */
    async function scanRectangle(bounds, version) {
      const found = new Map();
      const width = bounds.right - bounds.left, height = bounds.bottom - bounds.top;
      const columns = Math.max(1, Math.ceil(width / 24)), rows = Math.max(1, Math.ceil(height / 24));
      try {
        for (let row = 0; row <= rows; row++) {
          if (version !== rectangleVersion) return;
          const queries = [];
          for (let col = 0; col <= columns; col++) {
            const position = map.unproject([bounds.left + width * col / columns, bounds.top + height * row / rows]);
            queries.push(provider.findParcels({ lon: position.lng, lat: position.lat }));
          }
          const results = await Promise.all(queries);
          results.forEach(result => result.parcels.forEach(parcel => found.set(parcel.parcel_id, parcel)));
        }
        if (version === rectangleVersion) preview = found;
      } catch (_) { status.textContent = 'Nie można pobrać działek. Spróbuj ponownie.'; }
    }
    /** Refresh the pending selection when the rectangle changes. */
    function queueScan() {
      const bounds = updateRectangle();
      const version = ++rectangleVersion;
      pendingScan = scanRectangle(bounds, version);
    }
    /** Move gently near screen edges while the pointer is held, with no inertia. */
    function panNearEdge(now) {
      if (!drawing) return;
      const elapsed = lastFrame === null ? 0 : Math.min((now - lastFrame) / 1000, .05);
      lastFrame = now;
      const rect = canvas.getBoundingClientRect();
      const margin = 44, speed = 28;
      const dx = cursor[0] < margin ? -speed : cursor[0] > rect.width - margin ? speed : 0;
      const dy = cursor[1] < margin ? -speed : cursor[1] > rect.height - margin ? speed : 0;
      if (dx || dy) { map.panBy([dx * elapsed, dy * elapsed], { duration: 0 }); updateRectangle(); }
      panFrame = requestAnimationFrame(panNearEdge);
    }
    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0 || pointerId !== null) return;
      pointerId = event.pointerId;
      const rect = canvas.getBoundingClientRect();
      startPoint = [event.clientX - rect.left, event.clientY - rect.top];
      cursor = startPoint;
      holdTimer = setTimeout(() => {
        drawing = true; suppressMapClick = true; map.dragPan.disable();
        canvas.setPointerCapture(pointerId); anchor = map.unproject(startPoint); preview = new Map();
        selectionBox.classList.add('visible'); status.textContent = 'Przeciągnij prostokąt nad działkami.';
        updateRectangle(); lastFrame = null; panFrame = requestAnimationFrame(panNearEdge);
      }, 450);
    });
    canvas.addEventListener('pointermove', event => {
      if (event.pointerId !== pointerId || !startPoint) return;
      const rect = canvas.getBoundingClientRect();
      const point = [event.clientX - rect.left, event.clientY - rect.top];
      if (!drawing && Math.hypot(point[0] - startPoint[0], point[1] - startPoint[1]) > 10) { clearTimeout(holdTimer); holdTimer = null; return; }
      if (!drawing) return;
      event.preventDefault(); cursor = point; updateRectangle();
    });
    /** Finish selection using the current rectangle and restore normal map panning. */
    async function endSelectionDrag(event) {
      if (event.pointerId !== pointerId) return;
      clearTimeout(holdTimer); holdTimer = null;
      const completed = drawing;
      if (completed) {
        cancelAnimationFrame(panFrame); queueScan(); drawing = false; map.dragPan.enable();
        selectionBox.classList.remove('visible'); setTimeout(() => { suppressMapClick = false; }, 350);
      }
      pointerId = null; startPoint = null; lastFrame = null;
      if (completed && event.type !== 'pointercancel') {
        await pendingScan;
        preview.forEach(parcel => selected.set(parcel.parcel_id, parcel));
        renderSelection();
        status.textContent = preview.size ? `Zaznaczono działki: ${preview.size}.` : 'Nie znaleziono działek w zaznaczonym obszarze.';
      } else if (completed) { rectangleVersion++; preview.clear(); }
    }
    canvas.addEventListener('pointerup', endSelectionDrag);
    canvas.addEventListener('pointercancel', endSelectionDrag);
    map.on('click', async event => {
      if (suppressMapClick) return;
      try { const result = await provider.findParcels({ lon: event.lngLat.lng, lat: event.lngLat.lat }); showMatches(result.parcels, true, { toggle: true }); }
      catch (_) { status.textContent = 'Nie można pobrać działek. Spróbuj ponownie.'; }
    });
    document.getElementById('search-form').addEventListener('submit', event => { event.preventDefault(); lookupParcelSearch(); });
    input.addEventListener('input', () => {
      clearTimeout(suggestionTimer);
      if (!topControls.classList.contains('searching')) return;
      suggestionTimer = setTimeout(lookupParcelSearch, 220);
    });
    document.getElementById('search-option').addEventListener('click', () => setSearch(true));
    document.getElementById('map-option').addEventListener('click', () => {
      setDrawer(false); status.textContent = 'Dotknij działki lub przytrzymaj i przeciągnij po mapie.';
      if (selected.size) {
        const bounds = new maplibregl.LngLatBounds();
        selected.forEach(parcel => parcel.geometry.coordinates[0].forEach(point => bounds.extend(point)));
        map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 450 });
      }
    });
    document.getElementById('import-option').addEventListener('click', () => { setDrawer(false); importDialog.showModal(); });
    document.getElementById('close-import').addEventListener('click', () => importDialog.close());
    document.getElementById('import-file').addEventListener('change', event => {
      const file = event.target.files[0];
      document.getElementById('import-note').textContent = file ? `Wybrano: ${file.name}. Odczyt pliku dodamy w kolejnym etapie.` : 'Import i odczyt pliku będą dostępne w kolejnym etapie.';
    });
    document.getElementById('locate').addEventListener('click', () => {
      if (!navigator.geolocation) { status.textContent = 'Lokalizacja nie jest dostępna na tym urządzeniu.'; return; }
      status.textContent = 'Ustalamy Twoją lokalizację…';
      navigator.geolocation.getCurrentPosition(position => { map.flyTo({ center: [position.coords.longitude, position.coords.latitude], zoom: 15 }); status.textContent = 'Lokalizacja znaleziona. Dotknij działki na mapie.'; }, () => { status.textContent = 'Nie udało się ustalić lokalizacji. Możesz wyszukać działkę lub wybrać ją na mapie.'; });
    });
    next.addEventListener('click', () => {
      const count = selected.size;
      const parcelWord = count === 1 ? 'działkę' : count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 12 || count % 100 > 14) ? 'działki' : 'działek';
      status.textContent = `Pole „${fieldNameInput.value.trim()}” obejmuje ${count} ${parcelWord}. Konfigurację upraw dodamy w kolejnym etapie.`;
      setDrawer(false);
    });
  </script>
</body>
</html>
