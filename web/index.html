<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyQGIS FastAPI Bridge - Web Viewer</title>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; }
    #sidebar { width: 340px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
    #map { flex: 1; height: 100%; }
    h1 { font-size: 16px; margin: 0; color: #1e293b; }
    p { font-size: 13px; margin: 0; color: #64748b; line-height: 1.4; }
    button { background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { background: #0369a1; }
    pre { background: #0f172a; color: #38bdf8; padding: 10px; border-radius: 4px; font-size: 11px; overflow-x: auto; flex: 1; margin: 0; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>🌐 PyQGIS FastAPI Bridge</h1>
    <p>Generyczny podgląd mapowy łączący MapLibre GL JS z backendem analitycznym.</p>
    
    <button onclick="fetchGeoJson()">📥 Fetch GeoJSON from API</button>
    <div id="status" style="font-size: 12px; color: #64748b;"></div>
    
    <pre id="output">// Odpowiedź z serwera pojawi się tutaj</pre>
  </div>

  <div id="map"></div>

  <script src="farmer-data.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [20.76, 52.175],
      zoom: 13
    });

    async function fetchGeoJson() {
      const status = document.getElementById('status');
      const out = document.getElementById('output');
      status.innerText = 'Odpytywanie API...';

      // Przykładowy poligon w GeoJSON (np. pobrany z API)
      const sampleGeoJson = {
        "type": "FeatureCollection",
        "features": [
          {
            "type": "Feature",
            "properties": { "id": "PARCEL-001", "name": "Przykładowy poligon" },
            "geometry": {
              "type": "Polygon",
              "coordinates": [
                [
                  [20.7510, 52.1810],
                  [20.7580, 52.1815],
                  [20.7575, 52.1765],
                  [20.7505, 52.1760],
                  [20.7510, 52.1810]
                ]
              ]
            }
          }
        ]
      };

      try {
        const res = await fetch('http://127.0.0.1:8000/api/v1/analysis/PARCEL-001');
        const data = await res.json();
        out.innerText = JSON.stringify(data, null, 2);
        status.innerHTML = '<span style="color: green;">✓ Dane pobrane z API</span>';
      } catch (e) {
        out.innerText = JSON.stringify(sampleGeoJson, null, 2);
        status.innerHTML = '<span style="color: #64748b;">(Tryb offline: załadowano lokalny GeoJSON)</span>';
      }

      // Rysowanie niebieskiego obrysu na mapie
      if (map.getSource('sample-data')) {
        map.getSource('sample-data').setData(sampleGeoJson);
      } else {
        map.addSource('sample-data', {
          type: 'geojson',
          data: sampleGeoJson
        });
        map.addLayer({
          id: 'polygon-fill',
          type: 'fill',
          source: 'sample-data',
          paint: {
            'fill-color': '#0284c7',
            'fill-opacity': 0.25
          }
        });
        map.addLayer({
          id: 'polygon-outline',
          type: 'line',
          source: 'sample-data',
          paint: {
            'line-color': '#0284c7',
            'line-width': 2
          }
        });
      }
    }
  </script>
</body>
</html>
